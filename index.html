<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mintyrachel — ceramic preorders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:   #f7c5c5;
      --dark: #5c2438;
      --mid:  #a05060;
    }

    body {
      font-family: 'Lora', serif;
      background: var(--bg);
      color: var(--dark);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: min(860px, 94vw);
      height: min(540px, 88vh);
      border-radius: 28px;
      box-shadow: 0 16px 48px rgba(92, 36, 56, 0.22);
    }

    /* photo */
    .photo-side {
      position: relative;
      height: 100%;
      border-radius: 28px 0 0 28px;
      overflow: hidden;
    }
    .photo-side img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* info panel */
    .info-side {
      background: #fff0f2;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2.5rem;
      text-align: center;
      gap: 1.2rem;
      border-radius: 0 28px 28px 0;
    }

    .eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--mid);
      font-weight: 600;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 700;
      color: var(--dark);
      line-height: 1.1;
    }
    h1 em {
      font-style: italic;
      font-weight: 600;
    }

    .tagline {
      font-size: 0.9rem;
      font-style: italic;
      font-weight: 600;
      color: var(--mid);
      letter-spacing: 0.02em;
    }

    .preorder-btn {
      display: inline-block;
      background: var(--dark);
      color: #fff0f2;
      text-decoration: none;
      padding: 1rem 2.4rem;
      border-radius: 50px;
      font-family: 'Lora', serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 18px rgba(92, 36, 56, 0.28);
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 0.4rem;
    }
    .preorder-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(92, 36, 56, 0.38);
    }
    .preorder-btn:active {
      transform: translateY(0) scale(0.97);
    }

    .social-links {
      display: flex;
      gap: 1rem;
      position: absolute;
      bottom: 2rem;
    }
    .social-links a {
      color: var(--mid);
      transition: color 0.2s, transform 0.2s;
      display: flex;
    }
    .social-links a:hover {
      color: var(--dark);
      transform: translateY(-2px);
    }
    .social-links svg {
      width: 22px;
      height: 22px;
    }
  </style>
</head>
<body>

  <div class="hero">
    <div class="photo-side">
      <img src="images/pool plates.jpeg" alt="mintyrachel ceramic pool plates" />
    </div>
    <div class="info-side">
      <p class="eyebrow">preorders open</p>
      <h1>minty<em>rachel</em></h1>
      <p class="tagline">small-batch, handmade ceramics</p>
      <a class="preorder-btn"
         href="https://docs.google.com/forms/d/e/1FAIpQLSc6E4O8FE02kdl-y7pU_aRoK2sJOuYRRBC8yM_7F6eJQtblBA/viewform"
         target="_blank">place a preorder ♡</a>

      <div class="social-links">
        <!-- Instagram -->
        <a href="https://instagram.com/mintyrachel" target="_blank" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"/>
          </svg>
        </a>
        <!-- Patreon -->
        <a href="https://patreon.com/mintyrachel?utm_medium=unknown&utm_source=join_link&utm_campaign=creatorshare_creator&utm_content=copyLink" target="_blank" aria-label="Patreon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <circle cx="14.5" cy="9.5" r="6.5"/>
            <rect x="3" y="2" width="3.5" height="20" rx="1"/>
          </svg>
        </a>
      </div>
    </div>
  </div>

</body>
</html>
