<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pottery Wheel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #a8d8ea; }
    canvas { display: block; }


    #reset {
      position: fixed; bottom: 22px; right: 50px;
      background: rgba(255,220,100,0.85);
      color: #5C3300;
      border: 2px solid #E8A000;
      padding: 9px 24px; cursor: pointer;
      font-family: Georgia, serif; font-size: 13px;
      letter-spacing: 1px; text-transform: uppercase;
      border-radius: 20px;
      transition: background 0.2s;
      z-index: 20;
    }
    #reset:hover { background: rgba(255,200,60,0.95); }
    #fire-btn {
      position: fixed; bottom: 72px; right: 50px;
      background: rgba(210,120,40,0.88);
      color: #fff8f0;
      border: 2px solid #C06820;
      padding: 13px 32px; cursor: pointer;
      font-family: Georgia, serif; font-size: 16px;
      letter-spacing: 1.5px; text-transform: uppercase;
      border-radius: 24px;
      transition: background 0.2s;
      z-index: 20;
      display: none;
    }
    #fire-btn:hover { background: rgba(230,140,50,0.98); }
    #kiln-overlay {
      position: fixed; inset: 0;
      background: #0A0500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
      z-index: 50;
    }
    #fire-ring {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 60;
      overflow: hidden;
    }
    .fire-emoji {
      position: absolute;
      line-height: 1;
      transform-origin: center center;
      animation: fireFlash var(--dur) ease-in var(--delay) infinite;
    }
    @keyframes fireFlash {
      0%   { transform: scale(0.08); opacity: 0; }
      18%  { opacity: 1; }
      65%  { transform: scale(var(--peak)); opacity: 1; }
      82%  { transform: scale(calc(var(--peak) * 1.18)); opacity: 0.5; }
      100% { transform: scale(0.05); opacity: 0; }
    }
    #hint {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.85);
      font-family: Georgia, serif; font-size: 16px;
      letter-spacing: 1.5px; pointer-events: none;
      white-space: nowrap; z-index: 20;
      text-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
    #stage-label {
      position: fixed; top: 48%; left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.90);
      font-family: Georgia, serif; font-size: 15px;
      letter-spacing: 2px; text-transform: uppercase;
      text-align: center; max-width: 200px; line-height: 1.65;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 2px 12px rgba(0,0,0,0.85);
      pointer-events: none; z-index: 20;
      transition: opacity 0.6s;
    }
    /* ── Bookshelf glaze panel ── */
    #glaze-panel {
      position: fixed;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      display: none;
      flex-direction: column;
      z-index: 20;
      width: 88px;
      background: linear-gradient(90deg,
        #4A2C10 0%, #6B4120 6%,
        #9A7040 50%,
        #6B4120 94%, #4A2C10 100%);
      border-radius: 4px;
      padding: 12px 0 12px;
      box-shadow: 3px 5px 18px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,200,100,0.12);
    }
    .glaze-opt {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 12px 14px;
      cursor: pointer;
      transition: opacity 0.14s;
      position: relative;
    }
    /* Shelf plank below each jar */
    .glaze-opt::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 13px;
      background: linear-gradient(180deg, #E8B870 0%, #C09040 40%, #8C6228 100%);
      box-shadow: 0 3px 6px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,230,160,0.35);
    }
    .glaze-opt canvas {
      display: block;
      border-radius: 4px;
      border: 2px solid transparent;
      transition: border-color 0.14s;
      position: relative; z-index: 1;
      filter: brightness(1.08);
    }
    .glaze-opt.active canvas { border-color: rgba(255,215,80,0.90); filter: brightness(1.15); }
    .glaze-opt:hover:not(.active) canvas { border-color: rgba(255,255,255,0.40); filter: brightness(1.12); }
    /* ── Skip animation button ── */
    #skip-btn {
      position: fixed; bottom: 72px; right: 50px;
      background: rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.80);
      border: 1.5px solid rgba(255,255,255,0.30);
      padding: 7px 18px; cursor: pointer;
      font-family: Georgia, serif; font-size: 11px;
      letter-spacing: 2px; text-transform: uppercase;
      border-radius: 20px; display: none;
      transition: background 0.2s, color 0.2s;
      z-index: 25;
    }
    #skip-btn:hover { background: rgba(255,255,255,0.28); color: rgba(255,255,255,1); }
    #fire-btn2 {
      position: fixed; bottom: 72px; right: 50px;
      background: rgba(210,120,40,0.88);
      color: #fff8f0;
      border: 2px solid #C06820;
      padding: 13px 32px; cursor: pointer;
      font-family: Georgia, serif; font-size: 16px;
      letter-spacing: 1.5px; text-transform: uppercase;
      border-radius: 24px;
      transition: background 0.2s;
      z-index: 20;
      display: none;
    }
    #fire-btn2:hover { background: rgba(230,140,50,0.98); }
    #masterpiece-label {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255,248,230,0.95);
      font-family: Georgia, serif; font-size: 26px;
      letter-spacing: 10px; text-transform: uppercase;
      pointer-events: none; z-index: 20;
      text-shadow: 0 2px 22px rgba(0,0,0,0.45);
      opacity: 0; transition: opacity 1.4s;
      white-space: nowrap; display: none;
    }
    #pick-flowers-btn {
      position: fixed; bottom: 72px; right: 50px;
      background: rgba(55,130,70,0.88);
      color: #f0fff4;
      border: 2px solid #2A7840;
      padding: 13px 32px; cursor: pointer;
      font-family: Georgia, serif; font-size: 16px;
      letter-spacing: 1.5px; text-transform: uppercase;
      border-radius: 24px;
      transition: background 0.2s;
      z-index: 20; display: none;
    }
    #pick-flowers-btn:hover { background: rgba(75,155,90,0.98); }
    #flower-hint {
      position: fixed; top: 36%; left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.88);
      font-family: Georgia, serif; font-size: 14px;
      letter-spacing: 1.5px; pointer-events: none;
      white-space: nowrap; z-index: 20;
      text-shadow: 0 1px 8px rgba(0,0,0,0.55);
      transition: opacity 0.5s;
      display: none;
    }
    #remove-flowers-btn {
      position: fixed; bottom: 22px; right: 50px;
      background: rgba(180,80,60,0.82);
      color: #fff8f0;
      border: 2px solid #A04030;
      padding: 9px 24px; cursor: pointer;
      font-family: Georgia, serif; font-size: 13px;
      letter-spacing: 1px; text-transform: uppercase;
      border-radius: 20px; z-index: 20; display: none;
      transition: background 0.2s;
    }
    #remove-flowers-btn:hover { background: rgba(210,90,65,0.96); }
    /* ── Share stage ── */
    #share-btn {
      position: fixed; bottom: 72px; right: 50px;
      background: rgba(175,75,115,0.90);
      color: #fff0f5;
      border: 2px solid #A84070;
      padding: 9px 24px; cursor: pointer;
      font-family: Georgia, serif; font-size: 13px;
      letter-spacing: 1px; text-transform: uppercase;
      border-radius: 20px; display: none;
      transition: background 0.2s; z-index: 20;
      white-space: nowrap;
    }
    #share-btn:hover { background: rgba(205,95,145,0.98); }
    #share-controls {
      position: fixed; bottom: 22px; right: 50px;
      display: none; flex-direction: column; align-items: flex-end; gap: 8px;
      z-index: 20;
    }
    #share-photo-btn, #make-new-btn {
      padding: 9px 24px; cursor: pointer;
      font-family: Georgia, serif; font-size: 13px;
      letter-spacing: 1px; text-transform: uppercase;
      border-radius: 20px; transition: background 0.2s;
      white-space: nowrap;
    }
    #share-photo-btn {
      background: rgba(175,75,115,0.90); color: #fff0f5;
      border: 2px solid #A84070;
    }
    #share-photo-btn:hover { background: rgba(205,95,145,0.98); }
    #make-new-btn {
      background: rgba(255,255,255,0.82); color: #5c2438;
      border: 2px solid #c0808a;
    }
    #make-new-btn:hover { background: rgba(255,255,255,0.97); }

    /* ── Mobile: shrink buttons, keep in corner ── */
    @media (max-width: 680px) {
      #fire-btn, #fire-btn2, #pick-flowers-btn {
        bottom: 52px; right: 14px;
        padding: 8px 16px; font-size: 11px;
        letter-spacing: 1px;
      }
      #reset, #remove-flowers-btn {
        bottom: 14px; right: 14px;
        padding: 6px 14px; font-size: 10px;
      }
      #share-btn {
        bottom: 52px; right: 14px;
        padding: 6px 14px; font-size: 10px;
      }
      #skip-btn {
        bottom: 52px; right: 14px;
        padding: 6px 14px; font-size: 9px;
      }
      #share-controls {
        bottom: 14px; right: 14px;
      }
      #glaze-panel {
        left: 6px;
        width: 68px;
      }
      #hint { display: none; }
      #stage-label { font-size: 12px; }
    }

    /* ── Preview mode: hide all interactive UI ── */
    body.preview-mode #fire-btn,
    body.preview-mode #reset,
    body.preview-mode #stage-label,
    body.preview-mode #hint,
    body.preview-mode #fire-btn2,
    body.preview-mode #masterpiece-label,
    body.preview-mode #pick-flowers-btn,
    body.preview-mode #flower-hint,
    body.preview-mode #remove-flowers-btn,
    body.preview-mode #skip-btn,
    body.preview-mode #share-btn,
    body.preview-mode #share-controls,
    body.preview-mode #glaze-panel { display: none !important; }
  </style>
</head>
<body>
  <div id="kiln-overlay"></div>
  <div id="fire-ring"></div>
  <button id="fire-btn">Fire Kiln</button>
  <button id="reset">Reset Clay</button>
  <div id="stage-label">Centering…</div>
  <div id="hint">Left/right shapes &nbsp;·&nbsp; Up/down moves hands &nbsp;·&nbsp; Drag the <em>top</em> up/down to change height</div>
  <div id="glaze-panel"></div>
  <button id="fire-btn2">Fire Kiln</button>
  <div id="masterpiece-label">Your Masterpiece</div>
  <button id="pick-flowers-btn">Pick Flowers</button>
  <div id="flower-hint">Click a bucket to add flowers to your vase</div>
  <button id="remove-flowers-btn">Remove Flowers</button>
  <button id="skip-btn">Skip Animation</button>
  <button id="share-btn">Share with a Loved One ♡</button>
  <div id="share-controls">
    <button id="share-photo-btn">Download ♡</button>
    <button id="make-new-btn">Make a New Vessel</button>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  if (new URLSearchParams(window.location.search).has('preview')) {
    document.body.classList.add('preview-mode');
  }
  (() => {

    // ── impressionist sunflower background ────────────────────────────────────
    function makeSunflowerBg(W = 1200, H = 800) {
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const ctx = c.getContext('2d');

      // Seeded PRNG
      let seed = 77;
      function rng() { seed = (seed * 1664525 + 1013904223) & 0xffffffff; return (seed >>> 0) / 0xffffffff; }
      function rr(a,b) { return a + rng()*(b-a); }
      function ri(a,b) { return Math.floor(rr(a, b+0.9999)); }
      function pick(arr) { return arr[ri(0, arr.length-1)]; }

      function dab(x, y, rx, ry, angle, col, alpha) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.ellipse(0, 0, Math.max(0.1,rx), Math.max(0.1,ry), 0, 0, Math.PI*2);
        ctx.fillStyle = col;
        ctx.fill();
        ctx.restore();
      }

      const horizonY = H * 0.40;

      // ── 1. SKY ──
      // Base gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
      skyGrad.addColorStop(0,   '#4A90C8');
      skyGrad.addColorStop(0.4, '#6AAED8');
      skyGrad.addColorStop(1,   '#A8D4F0');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, horizonY + 30);

      // Impressionist sky strokes
      const skyLight = ['#7EC4E8','#8ACEF0','#72BCE4','#96D0F0','#80C8EC'];
      const skyMid   = ['#5AA0CC','#62A8D4','#4E94C4','#6AAED8','#58A4CE'];
      const skyDark  = ['#3A7EB0','#4488BC','#3278A8','#4A90C0','#3E84B4'];
      for (let i = 0; i < 500; i++) {
        const x = rr(-20, W+20);
        const y = rr(0, horizonY + 10);
        const bright = y / horizonY; // brighter near horizon
        const cols = bright > 0.7 ? skyLight : bright > 0.4 ? skyMid : skyDark;
        dab(x, y, rr(20,90), rr(3,9), rr(-0.1,0.1), pick(cols), rr(0.15, 0.40));
      }

      // ── 2. CLOUDS ──
      function paintCloud(cx, cy, size) {
        const puffs = [
          {dx:0,   dy:0,    rx:size*0.60, ry:size*0.42},
          {dx:-size*0.55, dy:size*0.12, rx:size*0.42, ry:size*0.30},
          {dx: size*0.55, dy:size*0.14, rx:size*0.38, ry:size*0.28},
          {dx:-size*0.25, dy:-size*0.22, rx:size*0.35, ry:size*0.25},
          {dx: size*0.22, dy:-size*0.20, rx:size*0.32, ry:size*0.24},
          {dx: size*0.80, dy:size*0.20, rx:size*0.28, ry:size*0.20},
          {dx:-size*0.80, dy:size*0.20, rx:size*0.28, ry:size*0.22},
        ];
        // Cloud shadow base
        puffs.forEach(p => {
          dab(cx+p.dx+4, cy+p.dy+6, p.rx, p.ry, 0, '#8AAFC8', 0.18);
        });
        // Cloud body
        const cloudWhites = ['#F4F8FC','#EEF4FA','#F8FCFF','#EAEEF6','#F0F6FC'];
        const cloudGrey   = ['#D8E4F0','#CCDAE8','#D4E0EE','#C8D8E8','#D0DCF0'];
        puffs.forEach(p => {
          // dark underside
          dab(cx+p.dx, cy+p.dy+p.ry*0.5, p.rx*0.9, p.ry*0.45, 0, pick(cloudGrey), rr(0.4,0.65));
          // bright top
          dab(cx+p.dx, cy+p.dy, p.rx, p.ry, 0, pick(cloudWhites), rr(0.7,0.95));
          // impressionist surface dabs
          for (let i = 0; i < 12; i++) {
            dab(cx+p.dx+rr(-p.rx*0.6,p.rx*0.6), cy+p.dy+rr(-p.ry*0.5,p.ry*0.3),
              rr(p.rx*0.15, p.rx*0.45), rr(p.ry*0.15, p.ry*0.45),
              rr(-0.3,0.3), pick(cloudWhites), rr(0.25,0.55));
          }
        });
      }

      const cxs = W / 1200, cys = H / 800, cyOff = H > W ? H * 0.10 : 0;
      paintCloud(160*cxs,  90*cys + cyOff, 110*cxs);
      paintCloud(480*cxs,  55*cys + cyOff, 140*cxs);
      paintCloud(820*cxs,  80*cys + cyOff,  95*cxs);
      paintCloud(1060*cxs, 60*cys + cyOff, 120*cxs);
      paintCloud(310*cxs, 130*cys + cyOff,  75*cxs);
      paintCloud(680*cxs, 110*cys + cyOff,  85*cxs);

      // ── 3. DISTANT TREELINE / HEDGES ──
      const treeY = horizonY - 10;
      const treeGreen = ['#2E5A1A','#366420','#3A6C22','#284E16','#326018'];
      const treeLit   = ['#4A7E2A','#568830','#4E8028','#5A8A2E','#528430'];
      const treeSky   = ['#3A6A22','#426E28','#3E7224','#447626','#406E22'];

      for (let x = -20; x < W+20; x += ri(18,38)) {
        const bh = rr(30, 85);
        const bw = rr(22, 55);
        const by = treeY - bh * 0.5;
        for (let i = 0; i < 10; i++) {
          const col = rng() < 0.5 ? pick(treeGreen) : rng() < 0.7 ? pick(treeLit) : pick(treeSky);
          dab(x+rr(-bw*0.5,bw*0.5), by+rr(-bh*0.3,bh*0.4), rr(10,bw*0.7), rr(5,bh*0.5), rr(-0.3,0.3), col, rr(0.45,0.80));
        }
      }

      // ── 4. GROUND / LAWN ──
      const grassLight = ['#6A9A3A','#72A43E','#7AAE42','#68983A','#70A040'];
      const grassMid   = ['#508030','#587A34','#4A7428','#5C8232','#548030'];
      const grassDark  = ['#3A5E1E','#42661C','#366020','#3E641E','#445820'];
      const grassSun   = ['#8AB84C','#92C050','#84B448','#8EBC4E','#80B044'];

      // Base lawn fill
      const grassGrad = ctx.createLinearGradient(0, horizonY, 0, H);
      grassGrad.addColorStop(0,   '#6A9A3A');
      grassGrad.addColorStop(0.3, '#558030');
      grassGrad.addColorStop(1,   '#3A5A1C');
      ctx.fillStyle = grassGrad;
      ctx.fillRect(0, horizonY - 5, W, H - horizonY + 5);

      // Impressionist grass strokes
      for (let pass = 0; pass < 3; pass++) {
        const cols = pass === 0 ? grassMid : pass === 1 ? grassLight : grassDark;
        const N = pass === 0 ? 800 : pass === 1 ? 700 : 500;
        for (let i = 0; i < N; i++) {
          const x = rr(-10, W+10);
          const y = rr(horizonY, H+10);
          const depth = (y - horizonY) / (H - horizonY);
          const rx = rr(8, 30) * (0.4 + depth * 0.8);
          const ry = rr(2, 6) * (0.4 + depth * 0.6);
          dab(x, y, rx, ry, rr(-0.25, 0.25), pick(cols), rr(0.28, 0.60));
        }
      }

      // Sunlight patches on grass
      for (let i = 0; i < 250; i++) {
        const x = rr(0, W);
        const y = rr(horizonY + 20, H - 60);
        dab(x, y, rr(15, 60), rr(3, 10), rr(-0.2, 0.2), pick(grassSun), rr(0.08, 0.22));
      }

      // ── 5. FLOWER BEDS / GARDEN PATCHES ──

      // Palette for various flower types
      const rose     = ['#C8102E','#D41A30','#B80E28','#E02030','#CC1A2C'];
      const roseLight= ['#E84060','#F04868','#DC3858','#EE4465','#E04062'];
      const rosePink = ['#EE0018','#E00010','#F20020','#E8000C','#F00018'];
      const peony    = ['#CC0010','#BB0008','#D40012','#C0000C','#D8000E'];
      const lavender = ['#8878CC','#9080D4','#7A6EC4','#9484D0','#8070C8'];
      const lavLight = ['#B0A8E8','#A8A0E0','#B8B0EC','#A4A0DC','#ACAAE4'];
      const daisy    = ['#FCFC60','#F8F840','#FEF848','#FAFA50','#F6F63A'];
      const daisyW   = ['#F8F8F0','#F4F4EC','#FCFCF4','#F0F0E8','#F6F6EE'];
      const poppy    = ['#E02010','#CC1A0E','#D81E12','#E42416','#D01C10'];
      const poppyOr  = ['#F06020','#E85018','#F46824','#EA5A1C','#EC6422'];
      const hyacinth = ['#0030F0','#0028E8','#0A38F8','#0030EC','#0838F4'];
      const yellow   = ['#F4D020','#ECC018','#F8D428','#F0C81A','#FAD82C'];
      const white    = ['#F8F8F4','#F4F4F0','#FCFCF8','#F0F0EC','#F6F6F2'];
      const stem     = ['#3A6018','#426820','#3E641C','#446C20','#406218'];
      const leafCol  = ['#4A7A24','#528230','#467628','#508030','#4C7C2C'];
      // Sunflower petals / centers
      const pDeep  = ['#D4920A','#C88408','#E09C0C','#BC7C06','#D08808'];
      const pVivid = ['#F0B010','#E8A80C','#F4B818','#EAA808','#F8BC14'];
      const pBright= ['#FDD030','#FFCC28','#F8C820','#FFD438','#F6CA24'];
      const pPale  = ['#FFE870','#FFEA80','#FFF090','#FFE460','#FFEC78'];

      // Draw a simple impressionist flower cluster
      function flowerCluster(cx, cy, type, count, spread, size) {
        for (let i = 0; i < count; i++) {
          const fx = cx + rr(-spread, spread);
          const fy = cy + rr(-spread*0.4, spread*0.4);
          const fr = size * rr(0.7, 1.3);

          // Stem
          const stemH = fr * rr(1.5, 2.8);
          for (let s = 0; s < 3; s++) {
            ctx.save();
            ctx.globalAlpha = rr(0.5, 0.80);
            ctx.beginPath();
            ctx.moveTo(fx+rr(-1,1), fy);
            ctx.lineTo(fx+rr(-2,2), fy - stemH);
            ctx.strokeStyle = pick(stem);
            ctx.lineWidth = rr(1, 2.5);
            ctx.stroke();
            ctx.restore();
          }
          // Leaves
          if (rng() < 0.6) {
            const lx = fx + rr(-fr*0.5, fr*0.5);
            const ly = fy - stemH * rr(0.3, 0.7);
            dab(lx, ly, fr*rr(0.5,1.0), fr*rr(0.15,0.30), rr(-0.8,0.8), pick(leafCol), rr(0.5,0.8));
          }

          const topY = fy - stemH;
          if (type === 'rose') {
            // Multi-petal rose
            const NP = 12;
            for (let p = 0; p < NP; p++) {
              const a = (p/NP)*Math.PI*2;
              const pr = fr*0.38;
              dab(fx+Math.cos(a)*pr, topY+Math.sin(a)*pr*0.5, fr*0.34, fr*0.16, a, pick(rose), rr(0.55,0.80));
            }
            for (let p = 0; p < 8; p++) {
              const a = (p/8)*Math.PI*2 + 0.2;
              const pr = fr*0.22;
              dab(fx+Math.cos(a)*pr, topY+Math.sin(a)*pr*0.5, fr*0.26, fr*0.13, a, pick(roseLight), rr(0.50,0.75));
            }
            dab(fx, topY, fr*0.18, fr*0.12, 0, '#8C0820', rr(0.7,0.9));
          } else if (type === 'daisy') {
            const NP = 14;
            for (let p = 0; p < NP; p++) {
              const a = (p/NP)*Math.PI*2;
              dab(fx+Math.cos(a)*fr*0.46, topY+Math.sin(a)*fr*0.30, fr*0.40, fr*0.10, a,
                rng()<0.5 ? pick(daisyW) : pick(daisy), rr(0.65, 0.85));
            }
            dab(fx, topY, fr*0.22, fr*0.16, 0, '#D4A010', rr(0.75, 0.95));
            dab(fx, topY, fr*0.14, fr*0.10, 0, '#F0C020', rr(0.80, 1.0));
          } else if (type === 'poppy') {
            for (let p = 0; p < 5; p++) {
              const a = (p/5)*Math.PI*2;
              dab(fx+Math.cos(a)*fr*0.32, topY+Math.sin(a)*fr*0.22, fr*0.44, fr*0.30, a+rr(-0.3,0.3),
                rng()<0.6 ? pick(poppy) : pick(poppyOr), rr(0.60, 0.85));
            }
            dab(fx, topY, fr*0.22, fr*0.16, 0, '#1A0A00', rr(0.75, 0.95));
            dab(fx, topY, fr*0.12, fr*0.09, 0, '#3A2800', rr(0.80, 1.0));
          } else if (type === 'lavender') {
            const spikes = ri(4, 8);
            for (let s = 0; s < spikes; s++) {
              const sx = fx + rr(-fr*0.5, fr*0.5);
              const sy = topY + rr(-fr*0.3, fr*0.1);
              for (let d = 0; d < 8; d++) {
                dab(sx, sy - d*fr*0.12, fr*0.14, fr*0.08, rr(-0.2,0.2),
                  rng()<0.6 ? pick(lavender) : pick(lavLight), rr(0.50, 0.80));
              }
            }
          } else if (type === 'hyacinth') {
            for (let p = 0; p < 6; p++) {
              const bx = fx + rr(-fr*0.6, fr*0.6);
              const by = topY + rr(-fr*0.4, fr*0.2);
              dab(bx, by, fr*0.22, fr*0.30, rr(-0.3,0.3), pick(hyacinth), rr(0.55, 0.80));
              dab(bx, by+fr*0.14, fr*0.14, fr*0.12, 0, '#2848A8', rr(0.40, 0.65));
            }
          } else if (type === 'yellow') {
            const NP = 10;
            for (let p = 0; p < NP; p++) {
              const a = (p/NP)*Math.PI*2;
              dab(fx+Math.cos(a)*fr*0.40, topY+Math.sin(a)*fr*0.28, fr*0.38, fr*0.10, a, pick(yellow), rr(0.60, 0.85));
            }
            dab(fx, topY, fr*0.20, fr*0.14, 0, '#8B6010', rr(0.75, 0.95));
          } else if (type === 'sunflower') {
            // Back petals
            const NP = 18;
            for (let p = 0; p < NP; p++) {
              const a = (p + 0.5) / NP * Math.PI * 2;
              const pr = fr * 0.50;
              const px2 = fx + Math.cos(a) * pr;
              const py2 = topY + Math.sin(a) * pr * 0.72;
              dab(px2, py2, fr*0.36, fr*0.075, a, rng()<0.5 ? pick(pDeep) : pick(pVivid), rr(0.55, 0.80));
            }
            // Front petals
            for (let p = 0; p < NP; p++) {
              const a = p / NP * Math.PI * 2;
              const pr = fr * 0.46;
              const px2 = fx + Math.cos(a) * pr;
              const py2 = topY + Math.sin(a) * pr * 0.72;
              dab(px2, py2, fr*0.38, fr*0.080, a, rng()<0.4 ? pick(pVivid) : pick(pBright), rr(0.60, 0.88));
              // petal tip highlight
              dab(fx+Math.cos(a)*(pr+fr*0.28), topY+Math.sin(a)*(pr+fr*0.28)*0.72, fr*0.12, fr*0.04, a, pick(pPale), rr(0.35,0.60));
            }
            // Gold ring
            dab(fx, topY, fr*0.30, fr*0.22, 0, '#A07820', rr(0.55, 0.75));
            // Dark center
            dab(fx, topY, fr*0.24, fr*0.18, 0, '#3C1C04', rr(0.85, 1.0));
            dab(fx-fr*0.06, topY-fr*0.05, fr*0.18, fr*0.13, 0, '#6A4010', rr(0.60, 0.80));
            // Seed dabs
            for (let i = 0; i < 30; i++) {
              const sa = rr(0, Math.PI*2), sd = rr(0, fr*0.18);
              dab(fx+Math.cos(sa)*sd, topY+Math.sin(sa)*sd*0.75, rr(1,3), rr(0.5,1.5), sa, rng()<0.5 ? '#8B6014' : '#5A3808', rr(0.45, 0.80));
            }
          } else { // pink/peony
            const NP = 10;
            for (let p = 0; p < NP; p++) {
              const a = (p/NP)*Math.PI*2;
              dab(fx+Math.cos(a)*fr*0.34, topY+Math.sin(a)*fr*0.24, fr*0.32, fr*0.18, a,
                rng()<0.5 ? pick(peony) : pick(rosePink), rr(0.55, 0.80));
            }
            for (let p = 0; p < 7; p++) {
              const a = (p/7)*Math.PI*2 + 0.3;
              dab(fx+Math.cos(a)*fr*0.18, topY+Math.sin(a)*fr*0.12, fr*0.22, fr*0.12, a, pick(rosePink), rr(0.50, 0.75));
            }
            dab(fx, topY, fr*0.12, fr*0.08, 0, '#B01060', rr(0.70, 0.90));
          }
        }
      }

      // Scatter many flower clusters across garden
      const types = ['rose','daisy','poppy','lavender','hyacinth','hyacinth','yellow','pink','pink','rose','daisy'];

      // Background flower row (near horizon, smaller)
      for (let x = 20; x < W; x += ri(34, 72)) {
        const t = pick(types);
        const y = rr(horizonY + 5, horizonY + 55);
        const depth = 0.15;
        flowerCluster(x, y, t, ri(2,6), 20, 6+depth*12);
      }

      // Mid-ground clusters
      for (let x = -10; x < W+10; x += ri(44, 92)) {
        const t = pick(types);
        const y = rr(horizonY + 40, H * 0.72);
        const depth = (y - horizonY) / (H - horizonY);
        flowerCluster(x, y, t, ri(3,7), 38+depth*30, 8+depth*20);
      }

      // Foreground clusters (larger, closer)
      for (let x = -20; x < W+20; x += ri(50, 105)) {
        const t = pick(types);
        const y = rr(H * 0.72, H + 10);
        const depth = (y - horizonY) / (H - horizonY);
        flowerCluster(x, y, t, ri(4,8), 48+depth*40, 12+depth*28);
      }

      // Dedicated hyacinth patches
      [[320, H*0.60], [900, H*0.57]].forEach(([cx,cy]) => {
        const depth = (cy - horizonY) / (H - horizonY);
        flowerCluster(cx, cy, 'hyacinth', ri(5,9), 38, 9+depth*18);
      });

      // Dedicated sunflower bunches (2-4 per bunch)
      [[150, H*0.58], [440, H*0.54], [760, H*0.56], [1040, H*0.55]].forEach(([cx,cy]) => {
        const depth = (cy - horizonY) / (H - horizonY);
        flowerCluster(cx, cy, 'sunflower', ri(2,4), 18, 16+depth*22);
      });

      // Extra patches in a few spots
      [[180, H*0.60], [420, H*0.63], [700, H*0.57], [980, H*0.61]].forEach(([cx,cy]) => {
        const t = pick(types);
        const depth = (cy - horizonY) / (H - horizonY);
        flowerCluster(cx, cy, t, ri(4,7), 58, 10+depth*22);
        flowerCluster(cx+rr(-48,48), cy+rr(-16,16), pick(types), ri(3,5), 46, 8+depth*18);
      });

      // ── 6. WINDOW FRAME ──
      const FW = 46, MW = 20;
      const MX = W/2 - MW/2, MY = H*0.44;
      const wFace='#2E1608', wLight='#5C3018', wMid='#3E1E0C', wDark='#0A0200', BV=6;

      function woodBar(x, y, w, h, innerSides) {
        ctx.save();
        ctx.fillStyle = wFace;
        ctx.fillRect(x, y, w, h);
        ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
        for (let i = 0; i < 18; i++) {
          const gx = x + rr(0, w);
          ctx.fillStyle = rng()<0.5 ? wMid : wLight;
          ctx.globalAlpha = rr(0.10, 0.28);
          ctx.fillRect(gx, y, rr(1,3), h);
        }
        ctx.globalAlpha = 1;
        ctx.fillStyle = wLight;
        ctx.fillRect(x, y, w, BV);
        ctx.fillRect(x, y, BV, h);
        ctx.fillStyle = wDark;
        ctx.fillRect(x, y+h-BV, w, BV);
        ctx.fillRect(x+w-BV, y, BV, h);
        if (innerSides) {
          ctx.globalAlpha = 0.38;
          ctx.fillStyle = '#000';
          if (innerSides.includes('b')) ctx.fillRect(x, y+h-BV-4, w, 4);
          if (innerSides.includes('t')) ctx.fillRect(x, y+BV, w, 4);
          if (innerSides.includes('r')) ctx.fillRect(x+w-BV-4, y, 4, h);
          if (innerSides.includes('l')) ctx.fillRect(x+BV, y, 4, h);
          ctx.globalAlpha = 1;
        }
        ctx.restore();
      }

      function glassPane(px, py, pw, ph) {
        ctx.save();
        ctx.beginPath(); ctx.rect(px, py, pw, ph); ctx.clip();
        const gr = ctx.createLinearGradient(px, py, px+pw*0.6, py+ph*0.6);
        gr.addColorStop(0,    'rgba(255,255,255,0.06)');
        gr.addColorStop(0.4,  'rgba(255,255,255,0.02)');
        gr.addColorStop(0.41, 'rgba(255,255,255,0.00)');
        gr.addColorStop(1,    'rgba(255,255,255,0.01)');
        ctx.fillStyle = gr;
        ctx.fillRect(px, py, pw, ph);
        ctx.globalAlpha = 0.045;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px+pw*0.38, py);
        ctx.lineTo(px, py+ph*0.38);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.restore();
      }

      const SH = 22;
      ctx.save();
      const sg2 = ctx.createLinearGradient(0, H-FW-SH, 0, H-FW-SH+SH);
      sg2.addColorStop(0, wLight); sg2.addColorStop(1, wDark);
      ctx.fillStyle = sg2;
      ctx.fillRect(-4, H-FW-SH+4, W+8, SH);
      ctx.restore();

      woodBar(MX, 0, MW, H, 'lr');
      woodBar(0, MY, W, MW, 'tb');
      woodBar(0,      0,   W,  FW, 'b');
      woodBar(0,   H-FW,  W,  FW, 't');
      woodBar(0,      0,  FW,  H,  'r');
      woodBar(W-FW,   0,  FW,  H,  'l');

      glassPane(FW,    FW,    MX-FW,       MY-FW);
      glassPane(MX+MW, FW,    W-FW-MX-MW,  MY-FW);
      glassPane(FW,    MY+MW, MX-FW,        H-FW-MY-MW);
      glassPane(MX+MW, MY+MW, W-FW-MX-MW,  H-FW-MY-MW);

      return c;
    }

    // ── scene ──────────────────────────────────────────────────────────────────
    function makeBg() {
      const portrait = innerWidth < innerHeight;
      return new THREE.CanvasTexture(makeSunflowerBg(portrait ? 800 : 1200, portrait ? 1200 : 800));
    }
    const scene = new THREE.Scene();
    scene.background = makeBg();

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 50);
    camera.position.set(0, 2.0, 5.5);

    renderer.setSize(innerWidth, innerHeight);

    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;

    // ── lighting ───────────────────────────────────────────────────────────────
    scene.add(new THREE.AmbientLight(0xfff5cc, 1.2));

    const key = new THREE.DirectionalLight(0xfffde0, 2.2);
