    // ── potter's wheel ─────────────────────────────────────────────────────────
    const wheelGroup = new THREE.Group();
    scene.add(wheelGroup);

    const bat = new THREE.Mesh(
      new THREE.CylinderGeometry(2.0, 2.0, 0.10, 80),
      new THREE.MeshStandardMaterial({ color: 0x8A9098, roughness: 0.22, metalness: 0.88 })
    );
    bat.position.y = -0.05;
    bat.receiveShadow = true;
    wheelGroup.add(bat);

    for (let r = 0.25; r < 2.0; r += 0.22) {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(r, 0.008, 6, 72),
        new THREE.MeshStandardMaterial({ color: 0x6A7078, roughness: 0.35, metalness: 0.82 })
      );
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 0.001;
      wheelGroup.add(ring);
    }

    const shaft = new THREE.Mesh(
      new THREE.CylinderGeometry(0.11, 0.17, 1.3, 20),
      new THREE.MeshStandardMaterial({ color: 0x585E65, roughness: 0.28, metalness: 0.92 })
    );
    shaft.position.y = -0.67;
    wheelGroup.add(shaft);

    wheelGroup.position.y = -1.1;

    // ── clay model ─────────────────────────────────────────────────────────────
    const N       = 24;
    const SEGS    = 80;
    const H_MIN   = 0.35;
    const H_LIMIT = 2.2;

    let clayH = 0.85;
    let radii = [];

    // ── keyframe profiles ──────────────────────────────────────────────────────
    // Hemisphere dome: r = R·√(1−t²), bumps fade near apex so top stays smooth
    const KF_LUMP = Array.from({length: N}, (_, i) => {
      const t    = i / (N - 1);
      const dome = 0.72 * Math.sqrt(Math.max(0, 1 - t * t));
      const fade = (1 - t) * (1 - t);
      const bumps = (0.08 * Math.sin(t * 11.5) + 0.06 * Math.sin(t * 7.8 + 1.9)) * fade;
      return Math.max(0.012, dome + bumps);
    });

    // Classic cylinder — the interactive starting shape
    const KF_CYLINDER = Array.from({length: N}, (_, i) => {
      const t = i / (N - 1);
      return 0.65 - 0.10 * t + 0.04 * Math.sin(t * Math.PI);
    });

    // Two phases: hold the lump, then center & form the cylinder
    const ANIM = [
      { kfA: KF_LUMP,     kfB: KF_LUMP,     hA: 0.75, hB: 0.75, dur: 1.0, wobble:  1, cap: 'full' },
      { kfA: KF_LUMP,     kfB: KF_CYLINDER, hA: 0.75, hB: 2.0,  dur: 2.8, wobble: -1, cap: 'fade' },
    ];
    const ANIM_LABELS = [
      'Centering…',
      'Pulling walls…',
    ];

    let animPhase  = 0;
    let phaseT     = 0;
    let animating  = true;
    let totalAnimT = 0;

    const stageLabel = document.getElementById('stage-label');

    // Top cap — makes clay look solid before the hole is opened
    let topCapOpacity = 1.0;
    const topCapMat = new THREE.MeshStandardMaterial({
      color: 0x7A6E65, roughness: 0.82, metalness: 0, transparent: true, opacity: 1.0
    });
    let topCapMesh = null;

    function initRadii() {
      clayH = ANIM[ANIM.length - 1].hB;
      radii = [...KF_CYLINDER];
      topCapOpacity = 0;
      clayGroup.position.set(0, -1.1, 0);
      animating = false;
      document.getElementById('reset').style.display = 'block';
      stageLabel.style.display = 'none';
      document.getElementById('fire-btn').style.display = 'block';
    }

    radii = [...KF_LUMP];   // start in lump state

    function bandY(i) { return (i / (N - 1)) * clayH; }

    function buildProfile() {
      let r = [...radii];
      for (let pass = 0; pass < 3; pass++) {
        const s = [...r];
        for (let i = 1; i < N - 1; i++)
          s[i] = 0.25 * r[i - 1] + 0.5 * r[i] + 0.25 * r[i + 1];
        r = s;
      }
      return r.map((rx, i) => new THREE.Vector2(Math.max(0.01, rx), bandY(i)));
    }

    const clayMat = new THREE.MeshStandardMaterial({
      color: 0x7A6E65, roughness: 0.82, metalness: 0, side: THREE.DoubleSide,
      polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4,
    });
    const capMat = new THREE.MeshStandardMaterial({
      color: 0x7A6E65, roughness: 0.82, metalness: 0,
      polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4,
    });

    const clayGroup = new THREE.Group();
    clayGroup.position.y = -1.1;
    scene.add(clayGroup);
    let clayMesh = null, capMesh = null;

    // ── table (hidden until after firing) ─────────────────────────────────────
    const tableGroup = new THREE.Group();
    scene.add(tableGroup);
    tableGroup.visible = false;

    const woodMat = new THREE.MeshStandardMaterial({ color: 0x9B6B3A, roughness: 0.78, metalness: 0 });
    const legMat2 = new THREE.MeshStandardMaterial({ color: 0x7A5228, roughness: 0.82, metalness: 0 });

    // Tabletop — surface sits at world y = -1.1
    const tableTop = new THREE.Mesh(new THREE.BoxGeometry(5.0, 0.14, 2.8), woodMat);
    tableTop.position.y = -1.1 - 0.07;
    tableTop.receiveShadow = true;
    tableGroup.add(tableTop);

    // Table legs
    [[-2.1, -1.0], [2.1, -1.0], [-2.1, 1.0], [2.1, 1.0]].forEach(([lx, lz]) => {
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 1.6, 10), legMat2);
      leg.position.set(lx, -1.17 - 0.8, lz);
      leg.castShadow = true;
      tableGroup.add(leg);
    });

    // ── display pedestal (shown in final stage) ───────────────────────────────
    const pedestalGroup = new THREE.Group();
    scene.add(pedestalGroup);
    pedestalGroup.visible = false;

    const marbMat = new THREE.MeshStandardMaterial({ color: 0xF0EBE0, roughness: 0.22, metalness: 0.03 });
    // Shaft — tapers gently from base to top
    const pedShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.40, 3.4, 40), marbMat);
    pedShaft.position.y = -0.9;
    pedShaft.castShadow = true; pedShaft.receiveShadow = true;
    pedestalGroup.add(pedShaft);
    // Capital (top plate)
    const pedCap = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.52, 0.10, 40), marbMat);
    pedCap.position.y = 0.75;
    pedCap.castShadow = true;
    pedestalGroup.add(pedCap);
    // Base plinth
    const pedBase = new THREE.Mesh(new THREE.CylinderGeometry(0.58, 0.65, 0.20, 40), marbMat);
    pedBase.position.y = -2.62;
    pedBase.receiveShadow = true;
    pedestalGroup.add(pedBase);

    // Spotlight for the final stage (hidden until then)
    const spotlight = new THREE.SpotLight(0xfff8e8, 0, 12, Math.PI * 0.18, 0.4, 1.5);
    spotlight.position.set(0, 6, 1);
    spotlight.target.position.set(0, 1.2, 0);
    scene.add(spotlight);
    scene.add(spotlight.target);

    // ── flower stage ──────────────────────────────────────────────────────────
    const flowerStageGroup = new THREE.Group();
    scene.add(flowerStageGroup);
    flowerStageGroup.visible = false;

    const bouquetGroup = new THREE.Group();
    scene.add(bouquetGroup);
    bouquetGroup.visible = false;

    const bucketData = []; // { meshes: [], type: '' }
    let flowerStage = false;
    let flowersInVase = 0;
    const MAX_FLOWERS = 60;

    // ── share stage (built lazily on first use) ────────────────────────────────
    const shareSceneGroup = new THREE.Group();
    scene.add(shareSceneGroup);
    shareSceneGroup.visible = false;

    let shareStage = false;
    let shareSceneBuilt = false;
    const steamParticles = [];
    const cupData = [];
    const allCupMeshes = [];
    const shareRaycaster = new THREE.Raycaster();

    function buildPetalGeo(len, wid) {
      const s = new THREE.Shape();
      s.moveTo(0, 0);
      s.bezierCurveTo(-wid * 0.55, len * 0.28, -wid * 0.58, len * 0.72, 0, len);
      s.bezierCurveTo( wid * 0.58, len * 0.72,  wid * 0.55, len * 0.28, 0, 0);
      return new THREE.ShapeGeometry(s, 7);
    }

    // Rounder, more oval petal — control points pushed far outward
    function buildRoundPetalGeo(len, wid) {
      const s = new THREE.Shape();
      s.moveTo(0, 0);
      s.bezierCurveTo(-wid * 0.92, len * 0.20, -wid * 0.90, len * 0.72, 0, len);
      s.bezierCurveTo( wid * 0.90, len * 0.72,  wid * 0.92, len * 0.20, 0, 0);
      return new THREE.ShapeGeometry(s, 9);
    }

    function makeSunflowerHead() {
      const g = new THREE.Group();
      const nP = 16;
      // Bigger, rounder petals
      const outerGeo = buildRoundPetalGeo(0.28, 0.096);
      const innerGeo = buildRoundPetalGeo(0.19, 0.074);
      const outerMat = new THREE.MeshStandardMaterial({ color: 0xF5C000, roughness: 0.62, metalness: 0, side: THREE.DoubleSide });
      const innerMat = new THREE.MeshStandardMaterial({ color: 0xE08800, roughness: 0.65, metalness: 0, side: THREE.DoubleSide });
      for (let i = 0; i < nP; i++) {
        const a = (i / nP) * Math.PI * 2;
        const m = new THREE.Mesh(outerGeo, outerMat);
        m.rotation.z = a;
        g.add(m);
        const m2 = new THREE.Mesh(innerGeo, innerMat);
        m2.rotation.z = a + Math.PI / nP;
        m2.position.z = 0.004;
        g.add(m2);
      }
      const disk = new THREE.Mesh(
        new THREE.CircleGeometry(0.16, 24),
        new THREE.MeshStandardMaterial({ color: 0x281200, roughness: 0.92 })
      );
      disk.position.z = 0.008;
      g.add(disk);
      const bump = new THREE.Mesh(
        new THREE.SphereGeometry(0.13, 14, 8, 0, Math.PI * 2, 0, Math.PI * 0.55),
        new THREE.MeshStandardMaterial({ color: 0x3A1A00, roughness: 0.88 })
      );
      bump.position.z = 0.006;
      bump.rotation.x = Math.PI;
      g.add(bump);
      return g;
    }

    function makeHibiscusHead() {
      const g = new THREE.Group();
      const nP = 22;
      const geo = buildRoundPetalGeo(0.22, 0.060);
      const mat = new THREE.MeshStandardMaterial({ color: 0xCC1122, roughness: 0.55, metalness: 0, side: THREE.DoubleSide });
      for (let i = 0; i < nP; i++) {
        const m = new THREE.Mesh(geo, mat);
        m.rotation.z = (i / nP) * Math.PI * 2;
        g.add(m);
      }
      const disk = new THREE.Mesh(
        new THREE.CircleGeometry(0.085, 18),
        new THREE.MeshStandardMaterial({ color: 0xF2C400, roughness: 0.70 })
      );
      disk.position.z = 0.008;
      g.add(disk);
      return g;
    }

    function makeTulipHead(color) {
      const pts = [
        new THREE.Vector2(0.04, 0),   new THREE.Vector2(0.08, 0.06),
        new THREE.Vector2(0.13, 0.14), new THREE.Vector2(0.15, 0.22),
        new THREE.Vector2(0.13, 0.30), new THREE.Vector2(0.09, 0.33),
      ];
      const geo = new THREE.LatheGeometry(pts, 16);
      return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: color || 0xCC1144, roughness: 0.52, metalness: 0, side: THREE.DoubleSide }));
    }

    function makeHyacinthHead() {
      const g = new THREE.Group();
      // Hyacinth: dense cylindrical spike of small florets, darker at base, lighter at tip
      const matDeep  = new THREE.MeshStandardMaterial({ color: 0x3355BB, roughness: 0.52, metalness: 0.04 });
      const matMid   = new THREE.MeshStandardMaterial({ color: 0x5577DD, roughness: 0.50, metalness: 0.04 });
      const matLight = new THREE.MeshStandardMaterial({ color: 0x88AAFF, roughness: 0.48, metalness: 0.05 });
      const mats = [matDeep, matMid, matMid, matLight, matLight];

      const rows = 5, perRow = 6;
      const spikeH = 0.48;
      const baseR  = 0.13;

      for (let row = 0; row < rows; row++) {
        const t   = row / (rows - 1);
        const y   = t * spikeH;
        const r   = baseR * (1.0 - t * 0.32);
        const mat = mats[row];
        for (let j = 0; j < perRow; j++) {
          const angle = (j / perRow) * Math.PI * 2 + row * 0.55;
          const floret = new THREE.Mesh(new THREE.SphereGeometry(0.042, 6, 5), mat);
          floret.scale.set(0.75, 1.05, 0.75);
          floret.position.set(Math.cos(angle) * r, y, Math.sin(angle) * r);
          g.add(floret);
        }
      }
      // Tiny closed bud cluster at very tip
      const budMat = new THREE.MeshStandardMaterial({ color: 0xAABBFF, roughness: 0.48 });
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * Math.PI * 2;
        const bud = new THREE.Mesh(new THREE.SphereGeometry(0.028, 5, 4), budMat);
        bud.position.set(Math.cos(a) * 0.045, spikeH + 0.03, Math.sin(a) * 0.045);
        g.add(bud);
      }
      return g;
    }

    function makeFlowerMesh(type, stemH, lean) {
      lean = lean || 0;
      const g = new THREE.Group();
      const stemMat = new THREE.MeshStandardMaterial({ color: 0x2A6820, roughness: 0.76, metalness: 0 });

      // Stem curves in the local YZ plane: +Z is radially outward once the group
      // is rotated by azimuth around Y. Control point kept mostly vertical so the
      // stem starts straight up then sweeps outward — realistic bouquet shape.
      const outward = lean * stemH * 1.40;
      const tipY    = stemH * (1.0 - lean * 0.30);
      const p0 = new THREE.Vector3(0, 0,           0);
      const p1 = new THREE.Vector3(0, tipY * 0.62, outward * 0.10);
      const p2 = new THREE.Vector3(0, tipY,        outward);
      const curve = new THREE.QuadraticBezierCurve3(p0, p1, p2);

      g.add(new THREE.Mesh(
        new THREE.TubeGeometry(curve, 10, 0.013, 6, false),
        stemMat
      ));

      // Leaf at ~42% along the curve, sticking out in local X
      const leafP = curve.getPoint(0.42);
      const leafGeo = buildPetalGeo(0.17, 0.052);
      const leaf = new THREE.Mesh(leafGeo, new THREE.MeshStandardMaterial({
        color: 0x338030, roughness: 0.74, metalness: 0, side: THREE.DoubleSide
      }));
      leaf.position.set(leafP.x + 0.025, leafP.y, leafP.z);
      leaf.rotation.set(0, Math.PI * 0.5, Math.PI * 0.18);
      g.add(leaf);

      // Angle of stem tip from vertical — used to tilt the head so it faces
      // upward relative to the stem direction, not absolute world up
      const tipAngle = Math.atan2(outward, tipY);

      let head;
      if (type === 'sunflower') {
        head = makeSunflowerHead();
        head.rotation.x = -Math.PI / 2 + 0.18 + tipAngle * 0.6;
        head.scale.setScalar(1.28);
      } else if (type === 'hibiscus') {
        head = makeHibiscusHead();
        head.rotation.x = -Math.PI / 2 + 0.14 + tipAngle * 0.5;
      } else if (type === 'hyacinth') {
        head = makeHyacinthHead();
        // Spike points upward, tilts slightly with stem lean
        head.rotation.x = tipAngle * 0.55;
      } else {
        const colors = [0xCC1144, 0xDD6600, 0x9922AA, 0xFF8800];
        head = makeTulipHead(colors[Math.floor(Math.random() * colors.length)]);
        head.rotation.x = tipAngle * 0.65;
      }
      head.position.copy(p2);
      g.add(head);
      return g;
    }

    function makeBucket3D(flowerType, pos) {
      const g = new THREE.Group();
      g.position.set(pos[0], pos[1], pos[2]);
      const metalMat = new THREE.MeshStandardMaterial({ color: 0x8A9A88, roughness: 0.28, metalness: 0.70, side: THREE.DoubleSide });
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.22, 0.52, 18, 1, true), metalMat);
      body.position.y = 0.26;
      g.add(body);
      const bottom = new THREE.Mesh(new THREE.CircleGeometry(0.22, 18), metalMat);
      bottom.rotation.x = -Math.PI / 2;
      bottom.position.y = 0.004;
      g.add(bottom);
      const rim = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.016, 8, 24), new THREE.MeshStandardMaterial({ color: 0xB0C0B0, roughness: 0.22, metalness: 0.78 }));
      rim.rotation.x = Math.PI / 2;
      rim.position.y = 0.52;
      g.add(rim);
      // Water fill — black surface visible from above
      const waterMat = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.10, metalness: 0.0 });
      const water = new THREE.Mesh(new THREE.CircleGeometry(0.24, 18), waterMat);
      water.rotation.x = -Math.PI / 2;
      water.position.y = 0.38;
      g.add(water);
      // Flowers in bucket
      const nF = 3 + Math.floor(Math.random() * 3);
      for (let i = 0; i < nF; i++) {
        const a = (i / nF) * Math.PI * 2 + Math.random() * 0.5;
        const r = 0.06 + Math.random() * 0.09;
        const f = makeFlowerMesh(flowerType, 0.48 + Math.random() * 0.38);
        f.position.set(Math.cos(a) * r, 0.38, Math.sin(a) * r);
        f.rotation.y = a;
        f.rotation.z = (Math.random() - 0.5) * 0.32;
        g.add(f);
      }
      g.userData.flowerType = flowerType;
      return g;
    }

    function setupFlowerStage() {
      const portrait = innerWidth < innerHeight;
      const outer = portrait ? 1.3 : 2.1;
      const inner = portrait ? 0.43 : 0.7;
      const bucketY = portrait ? -1.1 : -0.68;
      const defs = [
        { type: 'sunflower', pos: [-outer, bucketY, 2.5] },
        { type: 'hibiscus',  pos: [-inner, bucketY, 2.5] },
        { type: 'tulip',     pos: [ inner, bucketY, 2.5] },
        { type: 'hyacinth',  pos: [ outer, bucketY, 2.5] },
      ];
      defs.forEach(def => {
        const bucket = makeBucket3D(def.type, def.pos);
        flowerStageGroup.add(bucket);
        const meshes = [];
        bucket.traverse(c => { if (c.isMesh) meshes.push(c); });
        bucketData.push({ meshes, type: def.type });
      });
    }

    function dismissFlowerHint() {
      const el = document.getElementById('flower-hint');
      el.style.transition = 'opacity 0.5s';
      el.style.opacity = '0';
      setTimeout(() => { el.style.display = 'none'; }, 500);
    }

    function addFlowerToVase(type) {
      if (flowersInVase === 0) dismissFlowerHint();
      if (flowersInVase >= MAX_FLOWERS) return;
      const vaseTopY = clayGroup.position.y + clayH;
      const slot = flowersInVase;

      // Golden-angle spiral — even coverage with no clumping
      const goldenAngle = Math.PI * (3 - Math.sqrt(5));
      const azimuth = slot * goldenAngle + (Math.random() - 0.5) * 0.22;

      // t: 0 = very center flower, 1 = outermost
      const t = slot / Math.max(1, MAX_FLOWERS - 1);

      // Center flowers tall; outer flowers shorter.
      const stemH = Math.max(0.32, 1.12 - t * 0.80 + (Math.random() - 0.5) * 0.16);
      // Even center flowers lean slightly; later flowers ramp up faster (power < 1)
      const lean  = Math.min(0.95, 0.10 + Math.pow(t, 0.62) * 0.85 + (Math.random() - 0.5) * 0.08);

      const flower = makeFlowerMesh(type, stemH, lean);

      // Base offset grows more for outer flowers — wider, more dramatic spread
      const baseR = 0.03 + t * 0.14;
      flower.position.set(
        Math.sin(azimuth) * baseR,
        vaseTopY - 0.18,
        Math.cos(azimuth) * baseR
      );
      // Rotating the group by azimuth aligns local +Z with the radial outward direction
      flower.rotation.y = azimuth;

      bouquetGroup.add(flower);
      flowersInVase++;
    }

    // ── glaze jars ────────────────────────────────────────────────────────────
    // ── glaze texture generator ───────────────────────────────────────────────
    function makeGlazeTexture(idx) {
      const S = 512;
      const cv = document.createElement('canvas');
      cv.width = cv.height = S;
      const cx = cv.getContext('2d');
      let seed = 9001 + idx * 7919;
      const rng = () => { seed=(seed*1664525+1013904223)&0xffffffff; return (seed>>>0)/0xffffffff; };
      const rr  = (a,b) => a + rng()*(b-a);
      const ri  = (a,b) => Math.floor(rr(a, b+0.999));

      if (idx === 0) {
        // ── Cobalt Blue ── deep cobalt base with dramatic ice-crystal formations
        cx.fillStyle = '#080E38'; cx.fillRect(0,0,S,S);

        // Deep cobalt gradient — pools darker toward bottom
        const bg = cx.createLinearGradient(0,0,0,S);
        bg.addColorStop(0,   'rgba(55,100,205,0.42)');
        bg.addColorStop(0.45,'rgba(12,36,140,0.52)');
        bg.addColorStop(1,   'rgba(3,8,58,0.68)');
        cx.fillStyle=bg; cx.fillRect(0,0,S,S);

        // Glaze depth pools — varied cobalt hue
        for (let i=0;i<14;i++) {
          const x=rr(0,S),y=rr(S*0.1,S*1.1),r=rr(30,155);
          const g=cx.createRadialGradient(x,y,0,x,y,r);
          const hue=228+rr(-14,14), lt=ri(12,30);
          g.addColorStop(0,`hsla(${hue},74%,${lt}%,${rr(0.14,0.40)})`);
          g.addColorStop(1,'rgba(0,0,0,0)');
          cx.fillStyle=g; cx.fillRect(0,0,S,S);
        }

        // Dramatic ice / water-crystal formations
        const numCrystals=ri(7,11);
        for (let c=0;c<numCrystals;c++) {
          const crx=rr(S*0.07,S*0.93), cry=rr(S*0.07,S*0.93);
          const size=rr(48,140);
          const spikes=ri(12,24);
          const rot=rr(0,Math.PI*2);
          const pick3=rng();
          const tR=pick3<0.38?195:pick3<0.68?130:215;
          const tG=pick3<0.38?232:pick3<0.68?215:225;
          const tB=255;

          // Large glowing halo — crystal catches light against dark field
          const cglow=cx.createRadialGradient(crx,cry,0,crx,cry,size*2.2);
          cglow.addColorStop(0,`rgba(${tR},${tG},${tB},0.32)`);
          cglow.addColorStop(0.38,`rgba(${tR},${tG},${tB},0.10)`);
          cglow.addColorStop(1,'rgba(0,0,0,0)');
          cx.fillStyle=cglow; cx.fillRect(crx-size*2.5,cry-size*2.5,size*5,size*5);

          cx.save(); cx.translate(crx,cry); cx.rotate(rot);
          for (let j=0;j<spikes;j++) {
            const a=(j/spikes)*Math.PI*2;
            const len=size*rr(0.62,1.0);
            // Main arm — bright
            cx.beginPath(); cx.moveTo(0,0);
            cx.lineTo(Math.cos(a)*len,Math.sin(a)*len);
            cx.strokeStyle=`rgba(${tR},${tG},${tB},${rr(0.68,0.96)})`;
            cx.lineWidth=rr(1.0,2.8); cx.stroke();
            // Tip flare
            cx.beginPath();
            cx.moveTo(Math.cos(a)*len*0.82,Math.sin(a)*len*0.82);
            cx.lineTo(Math.cos(a)*len,Math.sin(a)*len);
            cx.strokeStyle=`rgba(255,255,255,${rr(0.60,0.90)})`;
            cx.lineWidth=rr(0.7,1.6); cx.stroke();
            // Tier-1 dendrite branches
            const brN=ri(3,6);
            for (let b=1;b<=brN;b++) {
              const bd=b/(brN+1);
              const bpx=Math.cos(a)*len*bd, bpy=Math.sin(a)*len*bd;
              const bl=len*(1-bd)*rr(0.24,0.52);
              [-0.42,0.42].forEach(off=>{
                cx.beginPath(); cx.moveTo(bpx,bpy);
                const ex=bpx+Math.cos(a+Math.PI/2+off)*bl;
                const ey=bpy+Math.sin(a+Math.PI/2+off)*bl;
                cx.lineTo(ex,ey);
                cx.strokeStyle=`rgba(${tR},${tG},${tB},${rr(0.48,0.82)})`;
                cx.lineWidth=rr(0.55,1.4); cx.stroke();
                // Tier-2 sub-branches
                if (rng()<0.60) {
                  const sbl=bl*rr(0.26,0.46);
                  const mx=bpx+Math.cos(a+Math.PI/2+off)*bl*0.52;
                  const my=bpy+Math.sin(a+Math.PI/2+off)*bl*0.52;
                  [-0.46,0.46].forEach(soff=>{
                    cx.beginPath(); cx.moveTo(mx,my);
                    cx.lineTo(mx+Math.cos(a+Math.PI/2+off+soff)*sbl,my+Math.sin(a+Math.PI/2+off+soff)*sbl);
                    cx.strokeStyle=`rgba(${tR},${tG},${tB},${rr(0.32,0.62)})`;
                    cx.lineWidth=rr(0.3,0.85); cx.stroke();
                  });
                }
              });
            }
          }
          // Brilliant nucleus — pure white core fading to crystal tint
          const nc=cx.createRadialGradient(0,0,0,0,0,size*0.22);
          nc.addColorStop(0,'rgba(255,255,255,1.0)');
          nc.addColorStop(0.28,`rgba(${tR},${tG},${tB},0.80)`);
          nc.addColorStop(1,'rgba(0,0,0,0)');
          cx.fillStyle=nc; cx.fillRect(-size*0.28,-size*0.28,size*0.56,size*0.56);
          cx.restore();
        }

        // Secondary concentric ring patterns (ice growth rings)
        for (let c=0;c<ri(6,12);c++) {
          const crx=rr(S*0.04,S*0.96), cry=rr(S*0.04,S*0.96);
          const maxR=rr(8,42);
          const rings=ri(3,7);
          for (let r2=1;r2<=rings;r2++) {
            const rad=(r2/rings)*maxR;
            cx.beginPath(); cx.arc(crx,cry,rad,0,Math.PI*2);
            cx.strokeStyle=`rgba(175,218,255,${rr(0.12,0.34)*(1-r2/rings+0.18)})`;
            cx.lineWidth=rr(0.4,1.3); cx.stroke();
          }
        }

        // Glassy specular highlight
        const shine=cx.createRadialGradient(S*0.26,S*0.18,0,S*0.5,S*0.5,S*0.76);
        shine.addColorStop(0,'rgba(215,235,255,0.52)');
        shine.addColorStop(0.30,'rgba(130,178,248,0.14)');
        shine.addColorStop(1,'rgba(255,255,255,0)');
        cx.fillStyle=shine; cx.fillRect(0,0,S,S);

      } else if (idx === 1) {
        // ── Crazing Green ── deep jade with dense fine crackle network throughout
        cx.fillStyle = '#1A4828'; cx.fillRect(0,0,S,S);

        // Rich jade base gradient
        const bg2 = cx.createLinearGradient(0,0,0,S);
        bg2.addColorStop(0,  'rgba(55,130,72,0.42)');
        bg2.addColorStop(0.5,'rgba(20,68,36,0.46)');
        bg2.addColorStop(1,  'rgba(6,22,12,0.60)');
        cx.fillStyle=bg2; cx.fillRect(0,0,S,S);

        // Glaze depth pools — tonal variation across surface
        for (let i=0;i<16;i++) {
          const x=rr(0,S),y=rr(0,S),r=rr(35,155);
          const g=cx.createRadialGradient(x,y,0,x,y,r);
          const hue=145+rr(-15,18), lt=ri(16,36);
          g.addColorStop(0,`hsla(${hue},50%,${lt}%,${rr(0.10,0.28)})`);
          g.addColorStop(1,'rgba(0,0,0,0)');
          cx.fillStyle=g; cx.fillRect(x-r,y-r,r*2,r*2);
        }

        // Dense crazing seed network — many seeds = small polygonal crackle cells
        const numSeeds=ri(200,270);
        const seeds=Array.from({length:numSeeds},()=>[rr(-S*0.02,S*1.02),rr(-S*0.02,S*1.02)]);
        cx.lineCap='round';

        // Cell interiors — subtle lighter glaze tone within each crackle facet
        seeds.forEach(([sx,sy])=>{
          const cr=rr(5,16);
          const g=cx.createRadialGradient(sx-cr*0.2,sy-cr*0.2,0,sx,sy,cr);
          g.addColorStop(0,`rgba(62,155,88,${rr(0.14,0.28)})`);
          g.addColorStop(0.7,`rgba(38,105,58,${rr(0.04,0.10)})`);
          g.addColorStop(1,'rgba(0,0,0,0)');
          cx.fillStyle=g; cx.fillRect(sx-cr,sy-cr,cr*2,cr*2);
        });

        // Crackle lines — dark shadow beneath, bright mint edge on top
        seeds.forEach(([sx,sy])=>{
          const neighbors=seeds
            .filter(s=>s[0]!==sx||s[1]!==sy)
            .map(s=>({s,d:Math.hypot(s[0]-sx,s[1]-sy)}))
            .sort((a,b)=>a.d-b.d)
            .slice(0,ri(2,4));
          neighbors.forEach(({s:[nx,ny],d})=>{
            if (d>S*0.14) return;
            const reach=rr(0.42,0.58);
            const ex=sx+(nx-sx)*reach+rr(-d*0.06,d*0.06);
            const ey=sy+(ny-sy)*reach+rr(-d*0.06,d*0.06);
            const mx=(sx+ex)/2+rr(-d*0.07,d*0.07);
            const my=(sy+ey)/2+rr(-d*0.07,d*0.07);
            // Dark crack shadow
            cx.beginPath(); cx.moveTo(sx,sy); cx.quadraticCurveTo(mx,my,ex,ey);
            cx.strokeStyle=`rgba(5,16,8,${rr(0.42,0.74)})`; cx.lineWidth=rr(1.4,2.8); cx.stroke();
            // Bright glassy crack edge — light catching the fracture
            cx.beginPath(); cx.moveTo(sx,sy); cx.quadraticCurveTo(mx,my,ex,ey);
            cx.strokeStyle=`rgba(148,220,170,${rr(0.40,0.70)})`; cx.lineWidth=rr(0.22,0.62); cx.stroke();
          });
        });

        // Glassy specular highlight over the crackle
        const shine=cx.createRadialGradient(S*0.30,S*0.22,0,S*0.5,S*0.5,S*0.72);
        shine.addColorStop(0,'rgba(195,245,215,0.40)');
        shine.addColorStop(0.35,'rgba(128,198,152,0.12)');
        shine.addColorStop(1,'rgba(255,255,255,0)');
        cx.fillStyle=shine; cx.fillRect(0,0,S,S);

      } else if (idx === 2) {
        // ── Mars Crystal Red CO-13 ── flowing copper-red, dark burgundy pools, silver+teal crystal breaks
        cx.fillStyle='#200404'; cx.fillRect(0,0,S,S);
        // Rich red base variation
        const bg=cx.createRadialGradient(S*0.55,S*0.4,0,S*0.5,S*0.5,S*0.85);
        bg.addColorStop(0,'rgba(110,14,8,0.6)'); bg.addColorStop(0.5,'rgba(70,8,4,0.4)'); bg.addColorStop(1,'rgba(20,2,2,0.2)');
        cx.fillStyle=bg; cx.fillRect(0,0,S,S);
        // Flowing copper-red streaks (like iron-red glaze movement)
        for (let i=0;i<20;i++) {
          const pts=[];
          let vx=rr(0,S),vy=rr(-S*0.1,S*0.5),va=rr(Math.PI*0.3,Math.PI*0.7);
          for (let s=0;s<30;s++) { va+=rr(-0.3,0.3); vx+=Math.cos(va)*rr(5,18); vy+=Math.sin(va)*rr(5,18); pts.push([vx,vy]); }
          cx.beginPath(); cx.moveTo(pts[0][0],pts[0][1]);
          pts.slice(1).forEach(p=>cx.lineTo(p[0],p[1]));
          const hue=rng()<0.6?10+rr(-8,8):30+rr(-5,10);
          cx.strokeStyle=`hsla(${hue},80%,${ri(30,55)}%,${rr(0.08,0.28)})`;
          cx.lineWidth=rr(1.0,4.5); cx.stroke();
        }
        // Dark burgundy pools (glaze pooling in depth)
        for (let i=0;i<14;i++) {
          const x=rr(0,S),y=rr(0,S),r=rr(28,130);
          const g=cx.createRadialGradient(x,y,0,x,y,r);
          g.addColorStop(0,`rgba(${ri(60,120)},${ri(4,18)},${ri(2,12)},${rr(0.20,0.50)})`);
          g.addColorStop(1,'rgba(0,0,0,0)');
          cx.fillStyle=g; cx.fillRect(x-r,y-r,r*2,r*2);
        }
        // Silver crystal bursts (varied density)
        for (let i=0;i<24;i++) {
          const bx=rr(0,S),by=rr(0,S),len=rr(5,55),spikes=ri(3,12);
          cx.save(); cx.translate(bx,by); cx.rotate(rng()*Math.PI*2);
          for (let j=0;j<spikes;j++) {
            const a=(j/spikes)*Math.PI*2+rr(-0.1,0.1);
            const l=len*rr(0.35,1.0);
            const isTeal=rng()<0.22;
            cx.beginPath(); cx.moveTo(0,0); cx.lineTo(Math.cos(a)*l,Math.sin(a)*l);
            cx.strokeStyle=isTeal?`rgba(60,180,140,${rr(0.3,0.75)})`:`rgba(${ri(200,248)},${ri(195,240)},${ri(185,228)},${rr(0.3,0.82)})`;
            cx.lineWidth=rr(0.4,2.2); cx.stroke();
          }
          const cg=cx.createRadialGradient(0,0,0,0,0,len*0.25);
          cg.addColorStop(0,`rgba(255,245,230,${rr(0.55,0.92)})`); cg.addColorStop(1,'rgba(0,0,0,0)');
          cx.fillStyle=cg; cx.fillRect(-len,-len,len*2,len*2);
          cx.restore();
        }
        // Teal breaks where glaze is thin (copper reduction effect)
        for (let i=0;i<10;i++) {
          const x=rr(0,S),y=rr(0,S),r=rr(10,50);
          const g=cx.createRadialGradient(x,y,0,x,y,r);
          g.addColorStop(0,`rgba(40,160,110,${rr(0.08,0.22)})`); g.addColorStop(1,'rgba(0,0,0,0)');
          cx.fillStyle=g; cx.fillRect(x-r,y-r,r*2,r*2);
        }
        // Warm gold flashes
        for (let i=0;i<8;i++) {
          const x=rr(0,S),y=rr(0,S),r=rr(12,55);
          const g=cx.createRadialGradient(x,y,0,x,y,r);
          g.addColorStop(0,`rgba(220,150,40,${rr(0.08,0.22)})`); g.addColorStop(1,'rgba(0,0,0,0)');
          cx.fillStyle=g; cx.fillRect(x-r,y-r,r*2,r*2);
        }

      } else {
        // Temmoku — near-black, hare's-fur amber/silver streaks, teal pooling at breaks
        const bg=cx.createLinearGradient(0,0,0,S);
        bg.addColorStop(0,'#060302'); bg.addColorStop(0.35,'#120806');
        bg.addColorStop(0.7,'#1C0E08'); bg.addColorStop(1,'#0A0502');
        cx.fillStyle=bg; cx.fillRect(0,0,S,S);
        // Hare's-fur vertical streaks
        for (let i=0;i<280;i++) {
          const x=rr(0,S), y1=rr(-S*0.25,S*0.5), y2=y1+rr(S*0.35,S*1.3);
          const drift=rr(-25,25);
          cx.beginPath(); cx.moveTo(x,y1);
          cx.bezierCurveTo(x+drift*0.25,y1+rr(25,70),x+drift*0.75,y1+(y2-y1)*0.55,x+drift,y2);
          const t=rng();
          let col;
          if      (t<0.30) col=`rgba(${ri(190,238)},${ri(85,145)},${ri(8,38)},${rr(0.07,0.22)})`;  // amber/rust
          else if (t<0.55) col=`rgba(${ri(100,175)},${ri(50,100)},${ri(8,28)},${rr(0.05,0.18)})`;  // brown
          else if (t<0.75) col=`rgba(${ri(200,248)},${ri(188,228)},${ri(130,188)},${rr(0.03,0.13)})`; // silver
          else             col=`rgba(${ri(30,80)},${ri(100,160)},${ri(90,140)},${rr(0.03,0.10)})`;  // teal
          cx.strokeStyle=col; cx.lineWidth=rr(0.3,1.7); cx.stroke();
        }
        // Teal/amber pooling at breaks
        for (let i=0;i<10;i++) {
          const x=rr(0,S),y=rr(0,S),r=rr(12,55);
          const g=cx.createRadialGradient(x,y,0,x,y,r);
          const col=rng()<0.5?`rgba(35,105,80,`:`rgba(195,110,18,`;
          g.addColorStop(0,col+`${rr(0.08,0.22)})`); g.addColorStop(1,'rgba(0,0,0,0)');
          cx.fillStyle=g; cx.fillRect(x-r,y-r,r*2,r*2);
        }
        // Rusty edge break
        const eg=cx.createLinearGradient(0,0,S*0.12,0);
        eg.addColorStop(0,'rgba(170,90,22,0.14)'); eg.addColorStop(1,'rgba(0,0,0,0)');
        cx.fillStyle=eg; cx.fillRect(0,0,S,S);
      }
      return new THREE.CanvasTexture(cv);
    }

    // Returns a CSS cursor string: a paintbrush SVG with colored bristles
    function paintbrushCursor(color) {
      const col = color || '#909090';
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="36"><rect x="10" y="0" width="4" height="22" rx="2" fill="#C4873A"/><rect x="11" y="1" width="1.5" height="20" rx="1" fill="rgba(255,255,255,0.30)"/><rect x="9" y="21" width="6" height="5" rx="1" fill="#A8A8A8"/><rect x="9" y="21" width="6" height="2" fill="#D0D0D0"/><path d="M9 26 Q7 34 12 36 Q17 34 15 26 Z" fill="${col}"/><path d="M10.5 27 Q9.5 33 12 35.5" stroke="rgba(255,255,255,0.42)" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>`;
      return `url("data:image/svg+xml,${encodeURIComponent(svg)}") 12 35, crosshair`;
    }

    // Draws a 2-D jar illustration onto a canvas, with the glaze texture filling the body
    function drawJarSwatch(canvas, texCanvas) {
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);
      // Knob
      ctx.fillStyle = '#C8BA98';
      ctx.beginPath(); ctx.ellipse(W*0.5, H*0.09, W*0.09, H*0.032, 0, 0, Math.PI*2); ctx.fill();
      // Lid trapezoid
      ctx.fillStyle = '#D4C4A2';
      ctx.beginPath(); ctx.moveTo(W*0.28,H*0.10); ctx.lineTo(W*0.72,H*0.10);
      ctx.lineTo(W*0.80,H*0.27); ctx.lineTo(W*0.20,H*0.27); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      ctx.beginPath(); ctx.moveTo(W*0.62,H*0.10); ctx.lineTo(W*0.72,H*0.10);
      ctx.lineTo(W*0.80,H*0.27); ctx.lineTo(W*0.70,H*0.27); ctx.closePath(); ctx.fill();
      // Rim band
      ctx.fillStyle = '#C2B28C';
      ctx.fillRect(W*0.16, H*0.27, W*0.68, H*0.07);
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.fillRect(W*0.16, H*0.27, W*0.68, H*0.025);
      // Body — clip to jar shape, fill with glaze texture, add side shading
      ctx.save();
      ctx.beginPath(); ctx.moveTo(W*0.17,H*0.34); ctx.lineTo(W*0.83,H*0.34);
      ctx.lineTo(W*0.77,H*0.92); ctx.lineTo(W*0.23,H*0.92); ctx.closePath(); ctx.clip();
      ctx.drawImage(texCanvas, 0, 0, W, H);
      const sg = ctx.createLinearGradient(0,0,W,0);
      sg.addColorStop(0,'rgba(255,255,255,0.28)'); sg.addColorStop(0.22,'rgba(255,255,255,0)');
      sg.addColorStop(0.78,'rgba(0,0,0,0)');       sg.addColorStop(1,'rgba(0,0,0,0.32)');
      ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);
      ctx.restore();
      // Body outline
      ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(W*0.17,H*0.34); ctx.lineTo(W*0.83,H*0.34);
      ctx.lineTo(W*0.77,H*0.92); ctx.lineTo(W*0.23,H*0.92); ctx.closePath(); ctx.stroke();
      // Base shadow
      ctx.fillStyle='rgba(0,0,0,0.18)';
      ctx.beginPath(); ctx.ellipse(W*0.5,H*0.925,W*0.27,H*0.022,0,0,Math.PI*2); ctx.fill();
    }

    const glazeDefs = [
      { color: 0x0A1848, roughness: 0.05, metalness: 0.12, label: 'Cobalt Blue', brushColor: '#3D6ED4' },
      { color: 0x1A4828, roughness: 0.04, metalness: 0.08, label: 'Crazing',     brushColor: '#3A8C50' },
      { color: 0x200404, roughness: 0.06, metalness: 0.13, label: 'Mars Red',    brushColor: '#C23020' },
      { color: 0x1A0C06, roughness: 0.09, metalness: 0.10, label: 'Temmoku',     brushColor: '#7A4A20' },
    ];
    let selectedGlaze = null;

    // Build bookshelf glaze panel — one jar per shelf
    const glazePanel = document.getElementById('glaze-panel');
    glazeDefs.forEach((g, i) => {
      const tex = makeGlazeTexture(i);
      const sw = document.createElement('canvas');
      sw.width = 60; sw.height = 86;
      drawJarSwatch(sw, tex.image);
      tex.dispose();

      const opt = document.createElement('div');
      opt.className = 'glaze-opt';
      opt.appendChild(sw);
      opt.addEventListener('click', () => {
        glazePanel.querySelectorAll('.glaze-opt').forEach(el => el.classList.remove('active'));
        opt.classList.add('active');
        selectedGlaze = i;
        renderer.domElement.style.cursor = paintbrushCursor(g.brushColor);
      });
      glazePanel.appendChild(opt);
    });

    function rebuildClay() {
      if (clayMesh)   { clayGroup.remove(clayMesh);   clayMesh.geometry.dispose(); }
      if (capMesh)    { clayGroup.remove(capMesh);    capMesh.geometry.dispose(); }
      if (topCapMesh) { clayGroup.remove(topCapMesh); topCapMesh.geometry.dispose(); topCapMesh = null; }

      const profile = buildProfile();

      clayMesh = new THREE.Mesh(new THREE.LatheGeometry(profile, SEGS), clayMat);
      clayMesh.castShadow = true;
      clayMesh.renderOrder = 1;
      clayGroup.add(clayMesh);

      // Bottom cap
      capMesh = new THREE.Mesh(new THREE.CircleGeometry(profile[0].x, SEGS), capMat);
      capMesh.rotation.x = -Math.PI / 2;
      capMesh.position.y = 0.001;
      capMesh.renderOrder = 1;
      clayGroup.add(capMesh);

      // Top cap — seals the clay so it looks solid during lump / centering
      if (topCapOpacity > 0.01) {
        const topR = profile[profile.length - 1].x;
        topCapMesh = new THREE.Mesh(new THREE.CircleGeometry(Math.max(topR, 0.05), SEGS), topCapMat);
        topCapMesh.rotation.x = Math.PI / 2;
        topCapMesh.position.y = profile[profile.length - 1].y - 0.001;
        topCapMat.opacity = topCapOpacity;
        clayGroup.add(topCapMesh);
      }
    }
    rebuildClay();

    // ── touch indicator ring ───────────────────────────────────────────────────
    const touchRingMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 });
    const touchRing = new THREE.Mesh(new THREE.TorusGeometry(1, 0.022, 8, 72), touchRingMat);
    touchRing.rotation.x = Math.PI / 2;
    touchRing.visible = false;
    scene.add(touchRing);

    // ── interaction ────────────────────────────────────────────────────────────
    const raycaster = new THREE.Raycaster();
    let dragging        = false;
    let resizingHeight  = false;  // true when dragging the top zone
    let activeH         = 0;
    let lastX = 0, lastY = 0;
    let dirty = false;

    function ndc(e) {
      return new THREE.Vector2(
        (e.clientX / innerWidth) * 2 - 1,
        -(e.clientY / innerHeight) * 2 + 1
      );
    }

    function inTopZone(hitY) { return hitY > clayH * 0.78; }

    let shapeHintShown = false;
    let hasInteracted = false;
    function dismissShapeHint() {
      if (!shapeHintShown) return;
      shapeHintShown = false;
      stageLabel.style.transition = 'opacity 0.3s';
      stageLabel.style.opacity = '0';
      setTimeout(() => { stageLabel.style.display = 'none'; }, 320);
    }

    renderer.domElement.addEventListener('mousedown', e => {
      if (animating) return;

      // ── orbit drag (flower stage only) ───────────────────────────────────────
      if (masterReady && flowerStage) {
        orbitActive = true;
        orbitDragX  = e.clientX;
        orbitDragY  = e.clientY;
        orbitMoved  = false;
        renderer.domElement.style.cursor = 'grabbing';
        return;
      }

      raycaster.setFromCamera(ndc(e), camera);

      // ── glazing interaction (post-fire) ──────────────────────────────────────
      if (fired) {
        // Check vase click with glaze selected
        if (selectedGlaze !== null && clayMesh) {
          const vaseHits = raycaster.intersectObject(clayMesh);
          if (vaseHits.length) {
            const g = glazeDefs[selectedGlaze];
            const tex = makeGlazeTexture(selectedGlaze);
            clayMat.map = tex;
            clayMat.color.set(0xffffff);
            clayMat.roughness = g.roughness;
            clayMat.metalness = g.metalness;
            clayMat.needsUpdate = true;
            capMat.map = tex;
            capMat.color.set(0xffffff);
            capMat.roughness = g.roughness;
            capMat.metalness = g.metalness;
            capMat.needsUpdate = true;
          }
        }
        return;
      }

      // ── throwing interaction (pre-fire) ──────────────────────────────────────
      hasInteracted = true;
      dismissShapeHint();
      const hits = raycaster.intersectObject(clayMesh);
      if (hits.length) {
        dragging       = true;
        const localY   = hits[0].point.y - clayGroup.position.y;
        activeH        = THREE.MathUtils.clamp(localY, 0, clayH);
        resizingHeight = inTopZone(localY);
        lastX = e.clientX;
        lastY = e.clientY;
      }
    });

    window.addEventListener('mousemove', e => {
      // ── orbit drag ─────────────────────────────────────────────────────────
      if (orbitActive) {
        const dx = e.clientX - orbitDragX;
        const dy = e.clientY - orbitDragY;
        if (Math.abs(dx) > 2 || Math.abs(dy) > 2) orbitMoved = true;
        if (orbitMoved) {
          if (flowerStage) {
            // Rotate vase + bouquet around Y axis only
            const rot = dx * 0.008;
            clayGroup.rotation.y += rot;
            bouquetGroup.rotation.y += rot;
          } else {
            orbitTheta -= dx * 0.006;
            orbitPhi = Math.max(0.06, Math.min(Math.PI * 0.46, orbitPhi + dy * 0.005));
            updateOrbitCamera();
          }
          orbitDragX = e.clientX;
          orbitDragY = e.clientY;
        }
        return;
      }

      if (!dragging) {
        if (animating) { renderer.domElement.style.cursor = 'default'; return; }
        if (masterReady && flowerStage) {
          raycaster.setFromCamera(ndc(e), camera);
          let over = false;
          for (const bd of bucketData) {
            if (raycaster.intersectObjects(bd.meshes, false).length) { over = true; break; }
          }
          renderer.domElement.style.cursor = over ? 'pointer' : 'grab';
          return;
        }
        if (fired) {
          if (!glazingReady) { renderer.domElement.style.cursor = 'default'; return; }
          if (selectedGlaze !== null) {
            raycaster.setFromCamera(ndc(e), camera);
            const vaseHits = raycaster.intersectObject(clayMesh);
            if (vaseHits.length) {
              renderer.domElement.style.cursor = paintbrushCursor(glazeDefs[selectedGlaze].brushColor);
              return;
            }
          }
          renderer.domElement.style.cursor = paintbrushCursor(selectedGlaze !== null ? glazeDefs[selectedGlaze].brushColor : null);
          return;
        }
        // Hover cursor: always show move to indicate both shaping and height are available
        raycaster.setFromCamera(ndc(e), camera);
        const hits = raycaster.intersectObject(clayMesh);
        if (hits.length) {
          renderer.domElement.style.cursor = 'move';
        } else {
          renderer.domElement.style.cursor = 'default';
        }
        return;
      }

      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;

      if (resizingHeight) {
        clayH = THREE.MathUtils.clamp(clayH - dy * 0.013, H_MIN, H_LIMIT);
        activeH = Math.min(activeH, clayH * 0.97);
      } else {
        // Vertical drag → slide hand up/down
        activeH = THREE.MathUtils.clamp(
          activeH - dy * (clayH / innerHeight) * 2.5,
          0.05, clayH * 0.97
        );
      }

      // Horizontal drag → always shape radius at current hand height
      const bi = Math.round((activeH / clayH) * (N - 1));
      const strength = dx * 0.0028;
      for (let i = 0; i < N; i++) {
        const d = i - bi;
        radii[i] = THREE.MathUtils.clamp(
          radii[i] + strength * Math.exp(-(d * d) / 7),
          0.04, 1.75
        );
      }
      dirty = true;
    });

    window.addEventListener('mouseup', e => {
      if (orbitActive) {
        // Treat as a click (no drag) → pick flower
        if (!orbitMoved && flowerStage && !shareStage) {
          const pickNdc = new THREE.Vector2(
            (orbitDragX / innerWidth)  * 2 - 1,
            -(orbitDragY / innerHeight) * 2 + 1
          );
          raycaster.setFromCamera(pickNdc, camera);
          for (const bd of bucketData) {
            const hits = raycaster.intersectObjects(bd.meshes, false);
            if (hits.length) { addFlowerToVase(bd.type); break; }
          }
        }
        orbitActive = false;
        orbitMoved  = false;
        renderer.domElement.style.cursor = flowerStage ? 'grab' : 'grab';
        return;
      }
      dragging = false;
      renderer.domElement.style.cursor = 'default';
    });

    // ── touch → mouse forwarding (mobile support) ─────────────────────────────
    function syntheticMouse(type, touch) {
      return new MouseEvent(type, { clientX: touch.clientX, clientY: touch.clientY, bubbles: true });
    }
    renderer.domElement.addEventListener('touchstart', e => {
      e.preventDefault();
      renderer.domElement.dispatchEvent(syntheticMouse('mousedown', e.touches[0]));
    }, { passive: false });
    renderer.domElement.addEventListener('touchmove', e => {
      e.preventDefault();
      window.dispatchEvent(syntheticMouse('mousemove', e.touches[0]));
    }, { passive: false });
    renderer.domElement.addEventListener('touchend', e => {
      window.dispatchEvent(syntheticMouse('mouseup', e.changedTouches[0]));
    });

    // ── clay-water particles ───────────────────────────────────────────────────
    const drops = [];

    function spawnDrop() {
      const a  = Math.random() * Math.PI * 2;
      const bi = Math.min(Math.floor(N * 0.45 + Math.random() * N * 0.4), N - 1);
      const r  = radii[bi];
      const y  = bandY(bi);
      const sp = 0.7 + Math.random() * 0.9;

      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.012 + Math.random() * 0.012, 5, 5),
        new THREE.MeshStandardMaterial({ color: 0x6A6058, roughness: 0.8, transparent: true, opacity: 1 })
      );
      mesh.position.set(Math.cos(a) * r, y, Math.sin(a) * r);
      scene.add(mesh);
      drops.push({ mesh, vx: Math.cos(a)*sp, vy: 0.12 + Math.random()*0.28, vz: Math.sin(a)*sp, life: 1 });
    }

    // ── resize ─────────────────────────────────────────────────────────────────
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    let fired = false;
    let glazingReady = false;
    let fired2 = false;
    let masterReady = false;
    let cameraOrbitAngle = 0; // kept for reset compatibility
    // Manual orbit state
    let orbitTheta = 0;
    let orbitPhi   = 0.30;
    const orbitRadius  = 6.5;
    const orbitLookY   = 1.2;
    let orbitActive = false;
    let orbitDragX  = 0;
    let orbitDragY  = 0;
    let orbitMoved  = false;

    function updateOrbitCamera() {
      camera.position.set(
        orbitRadius * Math.sin(orbitTheta) * Math.cos(orbitPhi),
        orbitRadius * Math.sin(orbitPhi),
        orbitRadius * Math.cos(orbitTheta) * Math.cos(orbitPhi)
      );
      camera.lookAt(0, orbitLookY, 0);
    }
    const overlay = document.getElementById('kiln-overlay');
    const fireRing = document.getElementById('fire-ring');
    const skipBtn = document.getElementById('skip-btn');

    function finishMasterpiece() {
      firingTimeouts.forEach(id => clearTimeout(id));
      firingTimeouts.length = 0;
      hideFireEmojis();
      overlay.style.transition = 'none';
      overlay.style.opacity = '0';
      overlay.style.pointerEvents = 'none';
      // Polish the fired glaze
      clayMat.roughness = Math.max(0.02, clayMat.roughness * 0.55);
      clayMat.metalness = Math.min(0.28, clayMat.metalness + 0.06);
      clayMat.needsUpdate = true;
      capMat.roughness = clayMat.roughness;
      capMat.metalness = clayMat.metalness;
      capMat.needsUpdate = true;
      tableGroup.visible = false;
      glazingReady = false;
      masterReady = true;
      scene.background = makeBg();
      document.getElementById('fire-btn2').style.display = 'none';
      document.getElementById('glaze-panel').style.display = 'none';
      document.getElementById('glaze-panel').querySelectorAll('.glaze-opt').forEach(el => el.classList.remove('active'));
      skipBtn.style.display = 'none';
      enterFlowerStage();
    }

    function enterFlowerStage() {
      if (flowerStage) return;
      flowerStage = true;

      // Show wheel (stationary), hide pedestal
      wheelGroup.visible = true;
      wheelGroup.rotation.y = 0;
      pedestalGroup.visible = false;
      spotlight.intensity = 0;

      // Move vase back to wheel level, rotate 180° to hide glaze seam
      clayGroup.position.set(0, -1.1, 0);
      clayGroup.rotation.y = Math.PI;
      bouquetGroup.rotation.y = Math.PI;

      // Camera: wider view to see vase + row of buckets in front
      orbitTheta = 0; orbitPhi = 0.30;
      camera.position.set(0, 1.8, 6.5);
      camera.lookAt(0, 0.5, 0);
      if (innerWidth < innerHeight) { camera.fov = 68; camera.updateProjectionMatrix(); }

      document.getElementById('pick-flowers-btn').style.display = 'none';
      document.getElementById('flower-hint').style.display = 'block';
      document.getElementById('remove-flowers-btn').style.display = 'block';
      document.getElementById('share-btn').style.display = 'block';
      document.getElementById('reset').style.display = 'none';
      setupFlowerStage();
      flowerStageGroup.visible = true;
      bouquetGroup.visible = true;
    }

    // Track firing timeouts so skip can cancel them
    const firingTimeouts = [];
    function firingTimeout(fn, delay) {
      const id = setTimeout(fn, delay);
      firingTimeouts.push(id);
      return id;
    }

    function finishGlazingScene() {
      firingTimeouts.forEach(id => clearTimeout(id));
      firingTimeouts.length = 0;
      hideFireEmojis();
      // Strip wheel scene if still visible
      wheelGroup.visible = false;
      drops.forEach(d => { scene.remove(d.mesh); d.mesh.geometry.dispose(); d.mesh.material.dispose(); });
      drops.length = 0;
      overlay.style.transition = 'none';
      overlay.style.opacity = '0';
      overlay.style.pointerEvents = 'none';
      clayMat.color.setHex(0xC8712A);
      clayMat.roughness = 0.88;
      clayMat.metalness = 0.0;
      capMat.color.setHex(0xC8712A);
      clayGroup.position.set(0, -1.1, 0);
      glazingReady = true;
      tableGroup.visible = true;
      document.getElementById('glaze-panel').style.display = 'flex';
      document.getElementById('fire-btn2').style.display = 'block';
      scene.background = makeBg();
      skipBtn.style.display = 'none';
    }

    skipBtn.addEventListener('click', () => {
      if (fired2 && !masterReady) {
        finishMasterpiece();
        return;
      }
      if (animating) {
        // Skip intro animation
        animating = false;
        radii = [...KF_CYLINDER];
        clayH = ANIM[ANIM.length - 1].hB;
        topCapOpacity = 0;
        clayGroup.position.set(0, -1.1, 0);
        dirty = true;
        stageLabel.style.transition = 'none';
        stageLabel.style.opacity = '0';
        stageLabel.style.display = 'none';
        document.getElementById('fire-btn').style.display = 'block';
        skipBtn.style.display = 'none';
        if (!hasInteracted) {
          setTimeout(() => {
            stageLabel.textContent = 'Use Your Mouse to Shape the Clay';
            stageLabel.style.display = 'block';
            stageLabel.style.transition = 'opacity 0.2s';
            stageLabel.style.opacity = '1';
            shapeHintShown = true;
          }, 50);
        }

    function buildShareScene() {
      if (shareSceneBuilt) return;

      const woodMat  = new THREE.MeshStandardMaterial({ color: 0x3E2210, roughness: 0.52, metalness: 0.02 });
      const darkWood = new THREE.MeshStandardMaterial({ color: 0x2C1808, roughness: 0.70, metalness: 0.01 });
      const grainMat = new THREE.MeshStandardMaterial({ color: 0x1E1005, roughness: 0.74, metalness: 0 });

      // Gingham cushion texture
      const ginghamCanvas = document.createElement('canvas');
      ginghamCanvas.width = ginghamCanvas.height = 128;
      const gc = ginghamCanvas.getContext('2d');
      const cell = 32; // 4 cells per tile
      gc.fillStyle = '#EEF5FA';
      gc.fillRect(0, 0, 128, 128);
      gc.fillStyle = 'rgba(120,178,220,0.52)';
      for (let i = 0; i < 4; i += 2) gc.fillRect(0, i * cell, 128, cell);
      for (let i = 0; i < 4; i += 2) gc.fillRect(i * cell, 0, cell, 128);
      const ginghamTex = new THREE.CanvasTexture(ginghamCanvas);
      ginghamTex.wrapS = ginghamTex.wrapT = THREE.RepeatWrapping;
      ginghamTex.repeat.set(3, 3);
      const cushMat = new THREE.MeshStandardMaterial({ map: ginghamTex, roughness: 0.88, metalness: 0 });

      const sharePortrait = innerWidth < innerHeight;

      // Dining table
      const tableW = sharePortrait ? 8.0 : 2.9;
      const tableD = sharePortrait ? 18 : 1.6;
      // Keep the far (top) edge at z=-0.8 (same as original 1.6-depth table),
      // only extend toward camera so the near edge goes off-screen at the bottom.
      const tableZCenter = sharePortrait ? tableD / 2 - 0.8 : 0;
      const tableTop = new THREE.Mesh(new THREE.BoxGeometry(tableW, 0.10, tableD), woodMat);
      tableTop.position.set(0, -1.15, tableZCenter);
      tableTop.receiveShadow = true;
      shareSceneGroup.add(tableTop);

      const grainZ = tableD - 0.02;
      if (sharePortrait) {
        const grainSpacing = 0.55;
        for (let n = 1; n * grainSpacing < tableW / 2; n++) {
          [-1, 1].forEach(side => {
            const strip = new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.003, grainZ), grainMat);
            strip.position.set(side * n * grainSpacing, -1.099, tableZCenter);
            shareSceneGroup.add(strip);
          });
        }
      } else {
        // 4 lines dividing table into 5 equal sections — inner gap = half the line spacing
        [-0.3, -0.1, 0.1, 0.3].forEach(f => {
          const strip = new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.003, grainZ), grainMat);
          strip.position.set(f * tableW, -1.099, tableZCenter);
          shareSceneGroup.add(strip);
        });
      }

      if (!sharePortrait) {
        const legH = 4.50;
        const legY = -3.40;
        [[-1.30, -0.70], [1.30, -0.70], [-1.30, 0.70], [1.30, 0.70]].forEach(([lx, lz]) => {
          const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.058, 0.046, legH, 14), woodMat);
          leg.position.set(lx, legY, lz);
          shareSceneGroup.add(leg);
        });
      }

      if (!sharePortrait) {
        // Chairs (desktop only)
        const addChair = (px, pz, ry) => {
          const grp = new THREE.Group();
          const seat = new THREE.Mesh(new THREE.BoxGeometry(0.88, 0.072, 0.80), darkWood);
          grp.add(seat);
          const cush = new THREE.Mesh(new THREE.BoxGeometry(0.76, 0.055, 0.68), cushMat);
          cush.position.y = 0.072;
          grp.add(cush);
          const back = new THREE.Mesh(new THREE.BoxGeometry(0.88, 0.80, 0.055), darkWood);
          back.position.set(0, 0.436, -0.375);
          grp.add(back);
          [-0.25, 0, 0.25].forEach(sx => {
            const slat = new THREE.Mesh(new THREE.BoxGeometry(0.046, 0.62, 0.046), darkWood);
            slat.position.set(sx, 0.346, -0.348);
            grp.add(slat);
          });
          [[-0.35, -0.32], [0.35, -0.32], [-0.35, 0.32], [0.35, 0.32]].forEach(([llx, llz]) => {
            const cleg = new THREE.Mesh(new THREE.CylinderGeometry(0.030, 0.024, 3.50, 9), darkWood);
            cleg.position.set(llx, -1.786, llz);
            grp.add(cleg);
          });
          grp.position.set(px, -1.75, pz);
          grp.rotation.y = ry;
          shareSceneGroup.add(grp);
        };
        addChair(-2.20, 0,  Math.PI / 2);
        addChair( 2.20, 0, -Math.PI / 2);
      }

      // Cups
      const steamOrigins = [];
      const cupX = sharePortrait ? 1.3 : 1.10;
      [[-cupX, 0.22], [cupX, -0.22]].forEach(([cx, cz]) => {
        const cupIdx = cupData.length;
        const grp = new THREE.Group();
        const porcelain = new THREE.MeshStandardMaterial({
          color: 0xA8DCE0, roughness: 0.18, metalness: 0, side: THREE.DoubleSide
        });
        const liquidMat = new THREE.MeshStandardMaterial({
          color: 0x1A0800, roughness: 0.92, metalness: 0
        });
        const saucer = new THREE.Mesh(new THREE.CylinderGeometry(0.148, 0.128, 0.022, 26), porcelain);
        saucer.position.y = 0.011;
        grp.add(saucer);
        allCupMeshes.push({ mesh: saucer, cupIdx });
        const pts = [
          new THREE.Vector2(0.036, 0),    new THREE.Vector2(0.070, 0.016),
          new THREE.Vector2(0.081, 0.052), new THREE.Vector2(0.081, 0.094),
          new THREE.Vector2(0.078, 0.124), new THREE.Vector2(0.071, 0.147),
        ];
        const body = new THREE.Mesh(new THREE.LatheGeometry(pts, 24), porcelain);
        body.position.y = 0.023;
        grp.add(body);
        allCupMeshes.push({ mesh: body, cupIdx });
        const liquid = new THREE.Mesh(new THREE.CircleGeometry(0.066, 24), liquidMat);
        liquid.rotation.x = -Math.PI / 2;
        liquid.position.y = 0.166;
        grp.add(liquid);
        const hCurve = new THREE.CubicBezierCurve3(
          new THREE.Vector3(0.081, 0.061, 0),
          new THREE.Vector3(0.175, 0.061, 0),
          new THREE.Vector3(0.175, 0.131, 0),
          new THREE.Vector3(0.081, 0.131, 0)
        );
        const handle = new THREE.Mesh(new THREE.TubeGeometry(hCurve, 10, 0.011, 8, false), porcelain);
        grp.add(handle);
        allCupMeshes.push({ mesh: handle, cupIdx });
        grp.position.set(cx, -1.099, cz);
        if (sharePortrait) grp.scale.setScalar(2.0);
        shareSceneGroup.add(grp);
        cupData.push({ liquidMesh: liquid, state: 'idle', t: 0 });
        steamOrigins.push({ x: cx, y: -1.099 + 0.170, z: cz });
      });
      shareSceneGroup.userData.steamOrigins = steamOrigins;
    }

    function enterShareStage() {

      // Uniform scale — no stretching

      // Keep flower heads at the correct height; stems extend down into the vase
      bouquetGroup.position.y = clayGroup.position.y - shareVaseScale * originalVaseY;

      // Add a downward stem extension to each flower so the stem visually

    function captureScene() {
      renderer.render(scene, camera);
      const src = renderer.domElement;
      // Output as 4:5 portrait — Instagram's optimal feed ratio
      const outW = 1080, outH = 1350;
      const c = document.createElement('canvas');
      c.width = outW; c.height = outH;
      const ctx = c.getContext('2d');
      // Fill background colour in case of letterboxing
      ctx.fillStyle = '#a8d8ea';
      ctx.fillRect(0, 0, outW, outH);
      // Center-crop src to fill the 4:5 frame
      const srcAspect = src.width / src.height;
      const outAspect = outW / outH;
      let sx, sy, sw, sh;
      if (srcAspect > outAspect) {
        sh = src.height; sw = sh * outAspect;
        sx = (src.width - sw) / 2; sy = 0;
      } else {
        sw = src.width; sh = sw / outAspect;
        sx = 0; sy = (src.height - sh) / 2;
      }
      ctx.drawImage(src, sx, sy, sw, sh, 0, 0, outW, outH);
      const text     = 'mintyrachel.com';
      const fontSize = Math.max(18, Math.round(outH * 0.018));
      const pad      = Math.round(outH * 0.016);
      ctx.font         = `italic ${fontSize}px Georgia, serif`;
      ctx.textAlign    = 'right';
      ctx.textBaseline = 'bottom';
      ctx.shadowColor  = 'rgba(0,0,0,0.55)';
      ctx.shadowBlur   = 8;
      ctx.fillStyle    = 'rgba(255,255,255,0.75)';
      ctx.fillText(text, outW - pad, outH - pad);
      return c.toDataURL('image/jpeg', 0.93);
    }

    renderer.domElement.addEventListener('pointerdown', e => {
      if (!shareStage || allCupMeshes.length === 0) return;
      const rect = renderer.domElement.getBoundingClientRect();
      const nx = ((e.clientX - rect.left) / rect.width)  *  2 - 1;
      const ny = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
      shareRaycaster.setFromCamera(new THREE.Vector2(nx, ny), camera);
      const hits = shareRaycaster.intersectObjects(allCupMeshes.map(c => c.mesh));
      if (hits.length > 0) {
        const entry = allCupMeshes.find(c => c.mesh === hits[0].object);
        if (entry) {
          const cup = cupData[entry.cupIdx];
          if (cup && cup.state === 'idle') { cup.state = 'drinking'; cup.t = 0; }
        }
      }
    });

    // ── animate ────────────────────────────────────────────────────────────────
    const clock = new THREE.Clock();
    const SPIN = 2.2;

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      // ── intro animation ────────────────────────────────────────────────────
      if (animating) {
        totalAnimT += dt;
        const ph = ANIM[animPhase];
        phaseT += dt / ph.dur;

        if (phaseT >= 1) {
          if (animPhase < ANIM.length - 1) {
            animPhase++;
            phaseT = 0;
            stageLabel.textContent = ANIM_LABELS[animPhase];
          } else {
            // Opening done — hand control to user for pulling walls
            animating = false;
            skipBtn.style.display = 'none';
            radii = [...KF_CYLINDER];
            clayH  = ANIM[ANIM.length - 1].hB;
            topCapOpacity = 0;
            clayGroup.position.set(0, -1.1, 0);
            dirty  = true;
            stageLabel.style.transition = 'opacity 0.6s';
            stageLabel.style.opacity = '0';
            setTimeout(() => {
              if (hasInteracted) return;
              stageLabel.textContent = 'Use Your Mouse to Shape the Clay';
              stageLabel.style.display = 'block';
              stageLabel.style.transition = 'opacity 0.2s';
              stageLabel.style.opacity = '1';
              shapeHintShown = true;
            }, 150);
            document.getElementById('fire-btn').style.display = 'block';
          }
        }

        if (animating) {
          const et  = phaseT * phaseT * (3 - 2 * phaseT); // smoothstep
          const cur = ANIM[animPhase];

          // Interpolate profile and height
          radii = cur.kfA.map((v, i) => v + (cur.kfB[i] - v) * et);
          clayH = cur.hA + (cur.hB - cur.hA) * et;

          // Drive top cap opacity
          topCapOpacity = cur.cap === 'full' ? 1.0
                        : cur.cap === 'fade' ? 1.0 - et
                        : 0.0;

          // Wobble: simulates uncentered clay
          if (cur.wobble !== 0) {
            const amp = cur.wobble > 0 ? 0.22 : (1 - et) * 0.22;
            clayGroup.position.x = amp * Math.sin(totalAnimT * 9.5);
            clayGroup.position.z = amp * 0.4 * Math.cos(totalAnimT * 11.8);
          } else {
            clayGroup.position.x = 0;
            clayGroup.position.z = 0;
          }

          dirty = true;
        }
      }

      if (!fired2) wheelGroup.rotation.y += SPIN * dt;
      if (!fired2) clayGroup.rotation.y += SPIN * dt;

      if (dirty) { rebuildClay(); dirty = false; }

      if (dragging) {
        const bi = Math.min(Math.round((activeH / clayH) * (N - 1)), N - 1);
        touchRing.scale.setScalar(radii[bi]);
        touchRing.position.y = resizingHeight ? clayH : activeH;
        // Green ring = height mode, white ring = shaping mode
        touchRingMat.color.setHex(resizingHeight ? 0x88ffaa : 0xffffff);
        touchRing.visible = true;
      } else {
        touchRing.visible = false;
      }


      if (Math.random() < 0.05 && !fired) spawnDrop();

      for (let i = drops.length - 1; i >= 0; i--) {
        const p = drops[i];
        p.life -= dt * 1.4;
        p.vy   -= 3.5 * dt;
        p.mesh.position.x += p.vx * dt;
        p.mesh.position.y += p.vy * dt;
        p.mesh.position.z += p.vz * dt;
        p.mesh.material.opacity = Math.max(0, p.life);
        if (p.life <= 0 || p.mesh.position.y < -1) {
          scene.remove(p.mesh);
          p.mesh.geometry.dispose();
          p.mesh.material.dispose();
          drops.splice(i, 1);
        }
      }

      // Cup drink / refill animation + steam
      if (shareStage) {
        cupData.forEach(cup => {
          if (cup.state === 'drinking') {
            cup.t += dt / 2.0;
            if (cup.t >= 1) {
              cup.t = 1;
              cup.state = 'empty';
              setTimeout(() => { cup.state = 'refilling'; }, 1000);
            }
            cup.liquidMesh.position.y = 0.166 - cup.t * 0.082;
          } else if (cup.state === 'refilling') {
            cup.t -= dt / 0.5;
            if (cup.t <= 0) { cup.t = 0; cup.state = 'idle'; }
            cup.liquidMesh.position.y = 0.166 - cup.t * 0.082;
          }
        });
        steamParticles.forEach(p => {
          const cup = cupData[p.cupIdx];
          const active = !cup || cup.state === 'idle' || cup.state === 'refilling';
          p.t = (p.t + dt * 0.34) % 1;
          p.mesh.position.set(
            p.baseX + Math.sin(p.t * Math.PI * 4 + p.phase) * 0.032,
            p.baseY + p.t * 0.50,
            p.baseZ + Math.cos(p.t * Math.PI * 3 + p.phase + 1.2) * 0.020
          );
          if (active) {
            const fade = p.t < 0.18 ? p.t / 0.18 : p.t > 0.74 ? (1 - p.t) / 0.26 : 1;
            p.mesh.material.opacity = fade * 0.28;
          } else {
            p.mesh.material.opacity = 0;
          }
          p.mesh.scale.setScalar(0.38 + p.t * 1.1);
        });
      }

      renderer.render(scene, camera);
    }

    animate();
  })();
  </script>
</body>
